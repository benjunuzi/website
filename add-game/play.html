<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#04060d">
    <title>Practice Game · ben.junuzi.com</title>
    <link rel="icon" type="image/svg+xml" href="../logo-mark.svg">
    <link rel="icon" type="image/png" href="../logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #04060d;
            background-image: radial-gradient(900px 560px at 80% -10%, rgba(47,120,255,.22), transparent 60%);
            background-attachment: fixed;
            color: #e9eef9;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .surface { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
        .btn-primary { background: linear-gradient(135deg, #2b6bff, #4aa8ff); box-shadow: 0 8px 24px rgba(48,120,255,.45); }
        .practice-badge {
            background: linear-gradient(135deg, #12b76a, #35e08a);
            color: #04140c; font-size: 10px; font-weight: 800; letter-spacing: .08em;
            padding: 4px 9px; border-radius: 999px;
        }
        iframe { border: 0; display: block; width: 100%; }
    </style>
</head>
<body>
<div class="min-h-screen flex flex-col">

    <header class="px-4 py-3" style="background:rgba(4,6,13,.72); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.07);">
        <div class="mx-auto max-w-5xl flex items-center gap-3">
            <a href="index.html" class="w-10 h-10 grid place-items-center rounded-full surface text-slate-300 hover:text-white shrink-0" aria-label="Back to the Game Lab">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="game-emoji" class="text-xl shrink-0">🎮</span>
                    <h1 id="game-title" class="text-lg font-extrabold tracking-tight truncate">Practice Game</h1>
                    <span class="practice-badge shrink-0">PRACTICE</span>
                </div>
                <p id="game-meta" class="text-[11px] text-slate-400 truncate">loading…</p>
            </div>
            <a href="../index.html" class="btn-primary text-white font-bold px-3.5 py-2 rounded-xl text-xs shrink-0">All games</a>
        </div>
    </header>

    <main class="flex-1 px-3 py-3">
        <div class="mx-auto max-w-5xl">
            <div id="player-box" class="rounded-[22px] overflow-hidden border border-white/10 bg-[#02040a]">
                <iframe id="stage" sandbox="allow-scripts allow-pointer-lock" style="height:min(78vh, 780px);" title="Practice game"></iframe>
            </div>
            <p class="text-[11px] text-slate-500 mt-2 text-center">
                Practice mode · made by a player in the Game Lab, not part of the main games yet.
            </p>
        </div>
    </main>

    <div id="missing" class="hidden flex-1 px-4 py-16">
        <div class="mx-auto max-w-lg surface rounded-[26px] p-8 text-center">
            <div class="text-5xl mb-3">🕳️</div>
            <h2 class="text-xl font-extrabold">That practice game isn't here</h2>
            <p class="text-sm text-slate-400 mt-2">It may have been deleted by Ben, or the link is for a different device.</p>
            <a href="index.html" class="btn-primary inline-block text-white font-extrabold px-6 py-3 rounded-2xl text-sm mt-5">Open the Game Lab</a>
        </div>
    </div>
</div>

<script src="../practice-games.js"></script>
<script>
    function $(id) { return document.getElementById(id); }

    function params() {
        var out = {};
        location.search.replace(/^\?/, "").split("&").forEach(function (pair) {
            if (!pair) return;
            var bits = pair.split("=");
            out[decodeURIComponent(bits[0])] = decodeURIComponent((bits[1] || "").replace(/\+/g, " "));
        });
        return out;
    }

    var wanted = params().id || "";
    var shown = false;

    function showGame(game) {
        if (shown || !game) return;
        shown = true;
        document.title = game.title + " · Practice Game";
        $("game-emoji").textContent = game.emoji || "🎮";
        $("game-title").textContent = game.title;
        $("game-meta").textContent = game.goal + " · by " + (game.by || "Anonymous");
        $("stage").srcdoc = game.html;
        $("player-box").classList.remove("hidden");
    }

    function showMissing() {
        if (shown) return;
        $("player-box").classList.add("hidden");
        $("missing").classList.remove("hidden");
        $("missing").classList.add("flex");
    }

    PracticeGames.ready(function () {
        var game = PracticeGames.byId(wanted);
        if (game) showGame(game);
    });

    setTimeout(function () {
        if (!shown) showMissing();
    }, 1500);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Cover</title>
  <style>
    :root {
      --accent: #20e5b2;
      --accent-soft: #80ffe0;
      --deep: #042c33;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071b25;
    }

    body { font-family: Inter, Arial, sans-serif; }

    .cover {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 94% 13%, color-mix(in srgb, var(--accent) 80%, white) 0 2%, transparent 2.3%),
        radial-gradient(circle at 82% 21%, color-mix(in srgb, var(--accent) 40%, transparent) 0 3%, transparent 3.2%),
        linear-gradient(135deg, #07121e 0%, var(--deep) 48%, color-mix(in srgb, var(--accent) 30%, #07121e) 100%);
    }

    .burst {
      position: absolute;
      inset: -42% -22% -30% 31%;
      background: repeating-conic-gradient(
        from 2deg at 72% 52%,
        rgba(255,255,255,.13) 0 7deg,
        transparent 7deg 16deg
      );
      mix-blend-mode: screen;
      opacity: .7;
    }

    .art {
      position: absolute;
      top: 5%;
      right: -2%;
      width: 67%;
      height: 90%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.055);
      filter: saturate(1.35) contrast(1.12) brightness(.9);
      clip-path: polygon(11% 0, 100% 0, 100% 100%, 0 100%);
      border: 3px solid color-mix(in srgb, var(--accent) 60%, white);
      box-shadow: -18px 0 46px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .art-shade {
      position: absolute;
      left: 32%;
      top: 5%;
      width: 67%;
      height: 90%;
      background:
        linear-gradient(90deg, var(--deep) 0%, rgba(3,14,22,.16) 32%, transparent 65%),
        linear-gradient(0deg, rgba(3,12,19,.55), transparent 38%);
      clip-path: polygon(11% 0, 100% 0, 100% 100%, 0 100%);
      pointer-events: none;
    }

    .stripe {
      position: absolute;
      left: -10%;
      bottom: -18%;
      width: 63%;
      height: 40%;
      transform: rotate(-8deg);
      opacity: .88;
      background: repeating-linear-gradient(
        -45deg,
        var(--accent) 0 16px,
        color-mix(in srgb, var(--accent) 60%, #06161f) 16px 28px
      );
      clip-path: polygon(0 42%, 100% 0, 100% 54%, 0 100%);
    }

    .content {
      position: absolute;
      z-index: 3;
      left: 34px;
      top: 32px;
      bottom: 26px;
      width: 45%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      color: var(--deep);
      background: var(--accent-soft);
      border: 2px solid white;
      border-radius: 4px;
      box-shadow: 6px 6px 0 color-mix(in srgb, var(--accent) 42%, #001016);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 0;
      color: white;
      font-family: "Arial Black", Impact, Inter, sans-serif;
      font-size: 45px;
      font-weight: 950;
      line-height: .91;
      letter-spacing: -.045em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow:
        0 3px 0 color-mix(in srgb, var(--accent) 78%, #001418),
        0 8px 0 rgba(0,0,0,.38),
        0 14px 28px rgba(0,0,0,.75);
      -webkit-text-stroke: 1px rgba(0, 36, 38, .35);
    }

    h1.long { font-size: 30px; line-height: .96; }
    h1.very-long { font-size: 24px; line-height: 1; }

    .play {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      color: #061a20;
      background: white;
      border-radius: 999px;
      box-shadow: 0 7px 0 color-mix(in srgb, var(--accent) 70%, #061a20), 0 12px 24px rgba(0,0,0,.32);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .play::before {
      content: "▶";
      color: var(--deep);
      font-size: 11px;
    }

    .icon {
      position: absolute;
      right: 20px;
      bottom: 17px;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border-radius: 20px;
      border: 3px solid white;
      background:
        radial-gradient(circle at 27% 20%, rgba(255,255,255,.95), transparent 25%),
        linear-gradient(145deg, var(--accent-soft), var(--accent));
      box-shadow: 0 14px 28px rgba(0,0,0,.52), 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent);
      font-size: 39px;
      line-height: 1;
      transform: rotate(4deg);
    }

    .edge {
      position: absolute;
      inset: 0;
      z-index: 5;
      border: 5px solid color-mix(in srgb, var(--accent) 64%, white);
      box-shadow: inset 0 0 24px rgba(255,255,255,.16);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="burst"></div>
    <img class="art" id="art" alt="">
    <div class="art-shade"></div>
    <div class="stripe"></div>
    <div class="content">
      <div class="eyebrow" id="category">GAME</div>
      <h1 id="title">Game</h1>
      <div class="play">Play free online</div>
    </div>
    <div class="icon" id="icon">🎮</div>
    <div class="edge"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get("title") || "Game";
    const category = params.get("category") || "Arcade";
    const icon = params.get("icon") || "🎮";
    const image = params.get("img") || "";
    const accents = {
      Sports: ["#27e6ae", "#0a5c4d"],
      Arcade: ["#ff53cd", "#521343"],
      Action: ["#ff9b37", "#581b0d"],
      Music: ["#ff5e96", "#55102e"],
      Racing: ["#ffd43b", "#593c08"],
      Puzzle: ["#4ed2ff", "#103b61"],
      Adventure: ["#39e4d5", "#064653"],
      Battle: ["#a986ff", "#2e1852"],
      Other: ["#68b1ff", "#12365f"]
    };
    const [accent, deep] = accents[category] || accents.Other;
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty("--deep", deep);
    document.getElementById("title").textContent = title;
    document.getElementById("title").className = title.length > 32 ? "very-long" : title.length > 22 ? "long" : "";
    document.getElementById("category").textContent = category;
    document.getElementById("icon").textContent = icon;
    document.getElementById("art").src = image;
  </script>
</body>
</html>

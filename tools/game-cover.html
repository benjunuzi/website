<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Cover</title>
  <style>
    :root {
      --accent: #25d6b1;
      --accent-dark: #063d42;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #061b25;
    }

    body {
      font-family: Inter, "Arial Black", Arial, sans-serif;
    }

    .cover {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 78% 30%, color-mix(in srgb, var(--accent) 75%, white), transparent 32%),
        linear-gradient(135deg, var(--accent-dark), #06131f 58%, color-mix(in srgb, var(--accent) 45%, #06131f));
    }

    .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.045);
      filter: saturate(1.25) contrast(1.08) brightness(.82);
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2, 9, 17, .92) 0%, rgba(2, 9, 17, .52) 42%, transparent 75%),
        linear-gradient(0deg, rgba(2, 9, 17, .94) 0%, rgba(2, 9, 17, .18) 55%, rgba(2, 9, 17, .12) 100%);
    }

    .burst {
      position: absolute;
      right: -14%;
      top: -44%;
      width: 68%;
      aspect-ratio: 1;
      opacity: .82;
      background: repeating-conic-gradient(
        from -12deg,
        color-mix(in srgb, var(--accent) 90%, white) 0deg 8deg,
        transparent 8deg 18deg
      );
      clip-path: polygon(50% 0, 62% 35%, 100% 26%, 72% 54%, 92% 92%, 56% 69%, 31% 100%, 34% 61%, 0 48%, 38% 38%);
      mix-blend-mode: screen;
      filter: blur(.2px);
    }

    .slash {
      position: absolute;
      left: -12%;
      top: -20%;
      width: 46%;
      height: 140%;
      transform: rotate(14deg);
      opacity: .35;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: blur(1px);
      mix-blend-mode: screen;
    }

    .topline {
      position: absolute;
      inset: 24px 26px auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: white;
      background: rgba(0, 17, 24, .7);
      border: 2px solid rgba(255, 255, 255, .7);
      border-radius: 8px;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .32);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .category::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 13px var(--accent);
    }

    .icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border: 3px solid rgba(255, 255, 255, .8);
      border-radius: 24px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.8), transparent 28%),
        linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 35%, #06131f));
      box-shadow: 0 16px 36px rgba(0, 0, 0, .42), 0 0 32px color-mix(in srgb, var(--accent) 55%, transparent);
      font-size: 48px;
      line-height: 1;
      text-shadow: 0 5px 8px rgba(0, 0, 0, .35);
      transform: rotate(3deg);
    }

    .copy {
      position: absolute;
      inset: auto 36px 34px 32px;
    }

    .kicker {
      margin-bottom: 9px;
      color: color-mix(in srgb, var(--accent) 78%, white);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-shadow: 0 2px 9px rgba(0,0,0,.8);
    }

    h1 {
      max-width: 82%;
      margin: 0;
      color: white;
      font-family: "Arial Black", Impact, Inter, sans-serif;
      font-size: 50px;
      font-weight: 950;
      line-height: .93;
      letter-spacing: -.035em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow:
        0 3px 0 color-mix(in srgb, var(--accent-dark) 82%, black),
        0 8px 20px rgba(0,0,0,.92),
        0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
      -webkit-text-stroke: 1px rgba(0,0,0,.16);
    }

    h1.long { font-size: 34px; line-height: .96; }
    h1.very-long { font-size: 27px; line-height: 1; }

    .edge {
      position: absolute;
      inset: 0;
      border: 6px solid color-mix(in srgb, var(--accent) 70%, white);
      box-shadow: inset 0 0 32px rgba(255,255,255,.22);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="cover" id="cover">
    <img class="art" id="art" alt="">
    <div class="slash"></div>
    <div class="burst"></div>
    <div class="shade"></div>
    <div class="topline">
      <div class="category" id="category">GAME</div>
      <div class="icon" id="icon">🎮</div>
    </div>
    <div class="copy">
      <div class="kicker">Play free online</div>
      <h1 id="title">Game</h1>
    </div>
    <div class="edge"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get("title") || "Game";
    const category = params.get("category") || "Arcade";
    const icon = params.get("icon") || "🎮";
    const image = params.get("img") || "";
    const accents = {
      Sports: ["#28e2a7", "#06483e"],
      Arcade: ["#ff4fc8", "#38104f"],
      Action: ["#ff9a2e", "#551410"],
      Music: ["#ff4f8b", "#4b0d36"],
      Racing: ["#ffd52e", "#533508"],
      Puzzle: ["#49c6ff", "#12345d"],
      Adventure: ["#36e0d0", "#073d50"],
      Battle: ["#a77bff", "#281449"],
      Other: ["#5aa7ff", "#12305a"]
    };
    const [accent, dark] = accents[category] || accents.Other;
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty("--accent-dark", dark);
    document.getElementById("title").textContent = title;
    document.getElementById("title").className = title.length > 30 ? "very-long" : title.length > 20 ? "long" : "";
    document.getElementById("category").textContent = category;
    document.getElementById("icon").textContent = icon;
    document.getElementById("art").src = image;
  </script>
</body>
</html>

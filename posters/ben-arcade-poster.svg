      </g>
      <text x="1235" y="286" fill="#C6FAFF" text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800"
            letter-spacing="3">SCAN &amp; PLAY</text>
    </g>

    <!-- Closing call to action -->
    <g text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif">
      <text x="800" y="2115" fill="url(#blast)" font-size="116" font-weight="900"
            letter-spacing="-5">AND HAVE A BLAST!</text>
    </g>

    <g transform="translate(104 2284)">
      <rect width="1392" height="3" rx="1.5" fill="#87C9FF" fill-opacity=".4"/>
      <text x="0" y="63" fill="#9BBEE6" font-family="Arial, Helvetica, sans-serif"
            font-size="25" font-weight="700" letter-spacing="5">PLAY • EXPLORE • HAVE FUN</text>
      <text x="1392" y="63" fill="#9BBEE6" text-anchor="end"
            font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700"
            letter-spacing="3">BEN'S GAME ARCADE</text>
    </g>

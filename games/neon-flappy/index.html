<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>Neon Flappy 🐦 · ben.junuzi.com</title>
<link rel="icon" href="../../logo-mark.svg">
<link rel="apple-touch-icon" href="../../logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #04060d;
    --panel: rgba(255,255,255,.045);
    --line: rgba(255,255,255,.10);
    --text: #e9eef9;
    --muted: #93a0c4;
    --accent: #2f7bff;
    --accent2: #4aa8ff;
    --bird: #ffd166;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 78% -10%, rgba(122,47,255,.20), transparent 62%),
      radial-gradient(760px 480px at -6% 28%, rgba(47,120,255,.18), transparent 62%),
      radial-gradient(700px 460px at 60% 112%, rgba(255,209,102,.10), transparent 62%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent); color: #04060d; }

  .app {
    margin: auto;
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px 7px 9px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: border-color .18s ease, transform .18s ease;
  }
  .brand:hover { border-color: rgba(79,140,255,.65); transform: translateY(-1px); }
  .brand img { width: 22px; height: 22px; display: block; }

  .title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 14px;
    width: 100%;
  }

  .field {
    position: relative;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.11);
    background: rgba(6,8,20,.94);
    box-shadow:
      0 22px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(122,47,255,.16),
      0 0 70px rgba(122,47,255,.12);
    overflow: hidden;
    touch-action: none;
    cursor: pointer;
  }
  .field canvas { display: block; width: 100%; height: 100%; }

  .hud {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 168px;
    flex: 0 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 11px 10px;
    backdrop-filter: blur(8px);
    min-width: 0;
  }

  .k {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .v {
    margin-top: 2px;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .v.small { font-size: 15px; }

  .two { display: flex; gap: 8px; }
  .two .panel { flex: 1 1 0; }
  .two .score .v { color: var(--bird); }

  .medal-row {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .medal {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 15px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--line);
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .medal.bronze { background: linear-gradient(135deg, #b9773a, #8c5424); border-color: #c98a4b; }
  .medal.silver { background: linear-gradient(135deg, #cfd8e3, #93a0b4); border-color: #dbe3ee; }
  .medal.gold   { background: linear-gradient(135deg, #ffd166, #e0a012); border-color: #ffe08a; }
  .medal.platinum { background: linear-gradient(135deg, #9be7ff, #5f8dff); border-color: #c7f0ff; }

  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .ladder div {
    font-size: 9px;
    font-weight: 700;
    text-align: center;
    padding: 5px 0;
    border-radius: 8px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .ladder div.on { color: #fff; border-color: rgba(255,209,102,.6); background: rgba(255,209,102,.14); }

  .keys {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    padding: 0 2px;
  }
  .keys b { color: #dbe6ff; font-weight: 700; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    padding: 18px;
    background: linear-gradient(180deg, rgba(4,6,13,.68), rgba(4,6,13,.9));
    backdrop-filter: blur(4px);
    text-align: center;
  }
  .overlay.show { display: grid; }
  .overlay h2 {
    margin: 0 0 6px;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 900;
  }
  .overlay p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.55; }

  .final {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .final div {
    min-width: 84px;
    padding: 9px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
  }
  .final span { display: block; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .final b { font-size: 22px; font-weight: 900; }

  .btn {
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    padding: 11px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7b2ff7, #f107a3);
    box-shadow: 0 10px 26px rgba(123,47,247,.4), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }

  .controls {
    display: none;
    width: 100%;
    max-width: 460px;
    grid-template-columns: 2fr 1fr;
    gap: 8px;
    touch-action: none;
  }
  .controls button {
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 0;
    min-height: 52px;
    cursor: pointer;
  }
  .controls button.flap {
    background: linear-gradient(135deg, #7b2ff7, #f107a3);
    border-color: transparent;
    box-shadow: 0 8px 22px rgba(123,47,247,.35);
  }
  .controls button:active { transform: scale(.97); }

  body.touch .controls { display: grid; }
  body.touch .keys { display: none; }

  .credit {
    font-size: 11px;
    color: #6f7ea3;
    text-align: center;
  }
  .credit a { color: #9fb6e8; text-decoration: none; border-bottom: 1px solid rgba(159,182,232,.35); }
  .credit a:hover { color: #cfe1ff; }

  .mute {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .mute:hover { border-color: rgba(79,140,255,.65); }

  @media (max-width: 760px) {
    .stage { flex-direction: column; align-items: center; gap: 12px; }
    .hud { width: 100%; max-width: 440px; flex-direction: row; flex-wrap: nowrap; }
    .hud .two { flex: 1 1 auto; }
    .hud .panel.grow { flex: 1 1 auto; }
    /* The ladder and the live gap readout belong on a big screen */
    .hud .ladder,
    .hud #gapPanel { display: none; }
    .hud .medal-row { gap: 7px; }
    .hud .medal { width: 24px; height: 24px; font-size: 12px; }
    .hud .medal-row .v { font-size: 13px; }
    .hud .panel { padding: 7px 9px 8px; }
    .k { font-size: 8px; letter-spacing: .1em; }
    .v { font-size: 17px; }
    .title { display: none; }
  }
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <a class="brand" href="../../index.html">
      <img src="../../logo-mark.svg" alt="">
      ben.junuzi.com
    </a>
    <div class="title">🐦 Neon Flappy</div>
    <button class="mute" id="mute" title="Toggle sound">🔊</button>
  </header>

  <main class="stage">

    <div class="field" id="field">
      <canvas id="sky"></canvas>

      <div class="overlay show" id="overlay">
        <div>
          <h2 id="ovTitle">Neon Flappy</h2>
          <p id="ovText">Tap, click, or press Space to flap. Slip through the neon towers.</p>
          <div id="ovFinal" class="final" style="display:none"></div>
          <button class="btn" id="ovBtn">Play</button>
        </div>
      </div>
    </div>

    <aside class="hud">
      <div class="two">
        <div class="panel score">
          <div class="k">Score</div>
          <div class="v" id="score">0</div>
        </div>
        <div class="panel">
          <div class="k">Best</div>
          <div class="v" id="best">0</div>
        </div>
      </div>

      <div class="panel grow">
        <div class="k">Medal</div>
        <div class="medal-row" style="margin-top:6px">
          <div class="medal" id="medalIcon">—</div>
          <div class="v small" id="medalLabel">No medal yet</div>
        </div>
        <div class="ladder" id="ladder">
          <div data-medal="bronze" data-need="15">15</div>
          <div data-medal="silver" data-need="30">30</div>
          <div data-medal="gold" data-need="50">50</div>
          <div data-medal="platinum" data-need="70">70</div>
        </div>
      </div>

      <div class="panel grow" id="gapPanel">
        <div class="k">Gap</div>
        <div class="v small" id="gapLabel">175 px</div>
      </div>

      <div class="keys">
        <span><b>Tap / Click</b> flap</span>
        <span><b>Space / ↑</b> flap</span>
        <span><b>P</b> pause</span>
        <span><b>Enter</b> restart</span>
      </div>
    </aside>

  </main>

  <div class="controls" id="controls">
    <button class="flap" data-act="flap">Flap</button>
    <button data-act="pause">Pause</button>
  </div>

  <div class="credit">
    Part of <a href="../../index.html">ben.junuzi.com</a> · 🐦 Neon Flappy
  </div>

</div>

<script>
"use strict";

(function () {

  /* =========================
     CONSTANTS
  ========================= */

  const W = 420;
  const H = 700;

  const GROUND_H = 74;
  const CEILING = 6;

  const BIRD_X = 128;
  const BIRD_R = 14;

  // A flap lifts the bird roughly 57px, so the gap has to stay well clear of
  // that or every flap overshoots the opening.
  const GRAVITY = 1400;
  const FLAP_VELOCITY = -400;
  const MAX_FALL = 700;

  const PIPE_W = 74;

  // Balance note: a flap lifts the bird ~57px, so the opening has to stay
  // comfortably wider than that or the run becomes frame-perfect.
  const GAP_START = 190;
  const GAP_MIN = 158;

  const SPEED_START = 190;
  const SPEED_MAX = 290;

  const SPACING_START = 340;
  const SPACING_MIN = 300;

  const MEDALS = [
    { key: "platinum", score: 70, label: "Platinum" },
    { key: "gold", score: 50, label: "Gold" },
    { key: "silver", score: 30, label: "Silver" },
    { key: "bronze", score: 15, label: "Bronze" }
  ];

  // Must match .app { max-width } in the stylesheet
  const APP_MAX = 860;


  /* =========================
     DOM
  ========================= */

  const fieldEl = document.getElementById("field");
  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");

  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovFinal = document.getElementById("ovFinal");
  const ovBtn = document.getElementById("ovBtn");

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const medalIconEl = document.getElementById("medalIcon");
  const medalLabelEl = document.getElementById("medalLabel");
  const ladderEl = document.getElementById("ladder");
  const gapLabelEl = document.getElementById("gapLabel");
  const muteEl = document.getElementById("mute");


  /* =========================
     SOUND
  ========================= */

  let audioCtx = null;
  let muted = loadMuted();

  function loadMuted() {
    try { return localStorage.getItem("flappy.muted") === "1"; } catch (err) { return false; }
  }
  function saveMuted(v) {
    try { localStorage.setItem("flappy.muted", v ? "1" : "0"); } catch (err) {}
  }

  function beep(freq, duration, type = "square", gain = 0.05, slideTo = 0) {

    if (muted) return;

    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }

      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      }

      amp.gain.setValueAtTime(gain, audioCtx.currentTime);
      amp.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      osc.connect(amp);
      amp.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);

    } catch (err) {}
  }

  function updateMuteButton() {
    muteEl.textContent = muted ? "🔇" : "🔊";
  }


  /* =========================
     STATE
  ========================= */

  let state = "menu";       // menu | ready | play | paused | over

  let score = 0;
  let best = loadBest();

  let speed = SPEED_START;
  let gap = GAP_START;
  let spacing = SPACING_START;

  let pipes = [];
  let particles = [];
  let trail = [];

  let shake = 0;
  let flash = 0;
  let deathTimer = 0;
  let wingTime = 0;

  let view = { scale: 1, ox: 0, oy: 0 };

  const bird = {
    x: BIRD_X,
    y: H * 0.42,
    vy: 0,
    rot: 0
  };

  const groundOffset = { value: 0 };

  let lastTime = 0;
  let accumulator = 0;

  const STEP = 1 / 120;

  // Parallax city, generated once and scrolled forever
  const stars = [];
  const skyline = [[], [], []];

  function buildBackdrop() {

    stars.length = 0;

    for (let i = 0; i < 90; i++) {

      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H * 0.72),
        r: Math.random() * 1.6 + 0.5,
        phase: Math.random() * Math.PI * 2
      });
    }

    const layers = [
      { count: 9, wMin: 46, wMax: 78, hMin: 90, hMax: 170, y: H - GROUND_H },
      { count: 8, wMin: 58, wMax: 96, hMin: 130, hMax: 240, y: H - GROUND_H },
      { count: 7, wMin: 70, wMax: 120, hMin: 180, hMax: 330, y: H - GROUND_H }
    ];

    layers.forEach((layer, index) => {

      const list = skyline[index];
      list.length = 0;

      let x = 0;

      for (let i = 0; i < layer.count; i++) {

        const w = layer.wMin + Math.random() * (layer.wMax - layer.wMin);
        const h = layer.hMin + Math.random() * (layer.hMax - layer.hMin);

        const windows = [];

        for (let wy = 14; wy < h - 12; wy += 20) {
          for (let wx = 8; wx < w - 10; wx += 16) {
            if (Math.random() < 0.42) {
              windows.push({ x: wx, y: wy, on: Math.random() < 0.7 });
            }
          }
        }

        list.push({ x, w, h, windows });

        x += w + 8 + Math.random() * 18;
      }

      list.loop = x;
    });
  }


  /* =========================
     BEST + MEDALS
  ========================= */

  function loadBest() {
    try { return parseInt(localStorage.getItem("flappy.best") || "0", 10) || 0; } catch (err) { return 0; }
  }

  function saveBest(value) {
    try { localStorage.setItem("flappy.best", String(value)); } catch (err) {}
  }

  function medalFor(value) {

    for (const medal of MEDALS) {
      if (value >= medal.score) return medal;
    }

    return null;
  }


  /* =========================
     LAYOUT
  ========================= */

  function layout() {

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const compact = vw <= 760;

    const hudW = compact ? 0 : 168;
    const gapPx = compact ? 0 : 14;

    const topbar = document.querySelector(".topbar");
    const credit = document.querySelector(".credit");
    const controls = document.getElementById("controls");

    const controlsVisible = getComputedStyle(controls).display !== "none";

    const chrome =
      topbar.offsetHeight +
      credit.offsetHeight +
      (controlsVisible ? controls.offsetHeight : 0) +
      (compact ? 130 : 34) +
      32;

    const availW = Math.min(vw - 32, APP_MAX) - hudW - gapPx;
    const availH = vh - chrome;

    let w = Math.min(availW, availH * (W / H));

    w = Math.max(compact ? 240 : 300, Math.min(w, 420));

    const h = w * (H / W);

    fieldEl.style.width = Math.round(w) + "px";
    fieldEl.style.height = Math.round(h) + "px";

    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    const scale = Math.min(w / W, h / H);

    view = { scale, ox: (w - W * scale) / 2, oy: (h - H * scale) / 2 };

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * view.ox, dpr * view.oy);
  }


  /* =========================
     GAME FLOW
  ========================= */

  function resetRun() {

    score = 0;
    speed = SPEED_START;
    gap = GAP_START;
    spacing = SPACING_START;

    pipes = [];
    particles = [];
    trail = [];

    bird.y = H * 0.42;
    bird.vy = 0;
    bird.rot = 0;

    shake = 0;
    flash = 0;
    deathTimer = 0;
    wingTime = 0;

    spawnPipe(W + 90);

    updateUI();
  }

  function startRun() {

    resetRun();

    state = "ready";

    hideOverlay();

    beep(660, 0.09, "square", 0.045);
  }

  function spawnPipe(x) {

    // Keep the gap inside comfortable bounds and away from the ground
    const margin = 74;
    const minY = margin + gap / 2;
    const maxY = H - GROUND_H - margin - gap / 2;

    // The bird can only climb so fast, so never place the next opening
    // further from the last one than a run of flaps can cover.
    const MAX_JUMP = 170;

    const previous = pipes.length ? pipes[pipes.length - 1].gapY : null;

    let low = minY;
    let high = maxY;

    if (previous !== null) {
      low = Math.max(low, previous - MAX_JUMP);
      high = Math.min(high, previous + MAX_JUMP);
    }

    if (high < low) high = low;

    const gapY = low + Math.random() * Math.max(0, high - low);

    pipes.push({
      x,
      gapY,
      gap,
      scored: false,
      wobble: Math.random() * Math.PI * 2
    });
  }

  function flap() {

    if (state === "menu" || state === "over") {
      startRun();
      return;
    }

    if (state === "paused") return;

    if (state === "ready") state = "play";

    bird.vy = FLAP_VELOCITY;
    wingTime = 0;

    beep(520 + Math.random() * 60, 0.06, "square", 0.04, 700);

    for (let i = 0; i < 4; i++) {

      trail.push({
        x: bird.x - BIRD_R * 0.6,
        y: bird.y + (Math.random() * 12 - 6),
        life: 0.4,
        r: 2 + Math.random() * 2
      });
    }
  }

  function addScore() {

    score++;

    // Difficulty ramp
    gap = Math.max(GAP_MIN, GAP_START - score);
    speed = Math.min(SPEED_MAX, SPEED_START + score * 2);
    spacing = Math.max(SPACING_MIN, SPACING_START - score * 0.8);

    beep(880, 0.07, "triangle", 0.045);

    updateUI();
  }

  function die(reason) {

    if (state === "over") return;

    state = "over";
    deathTimer = 0;

    shake = 16;
    flash = 1;

    beep(320, 0.18, "sawtooth", 0.06, 180);
    setTimeout(() => beep(220, 0.3, "sawtooth", 0.055, 110), 130);

    burst(bird.x, bird.y, "#ff5f6d", 26);

    if (score > best) {
      best = score;
      saveBest(best);
    }

    updateUI();
    showGameOver(reason);
  }

  function showGameOver(reason) {

    const medal = medalFor(score);

    ovTitle.textContent = reason === "ground" ? "Ouch — the deck!" : "Clipped a tower";

    ovText.textContent = medal
      ? "You earned the " + medal.label + " medal."
      : "Reach 10 points for your first medal.";

    ovFinal.style.display = "flex";

    ovFinal.innerHTML =
      '<div><span>Score</span><b>' + score + '</b></div>' +
      '<div><span>Best</span><b>' + best + '</b></div>';

    ovBtn.textContent = "Try again";

    overlay.classList.add("show");
  }

  function burst(x, y, color, count) {

    for (let i = 0; i < count; i++) {

      const a = Math.random() * Math.PI * 2;
      const s = 70 + Math.random() * 300;

      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.6,
        size: 2 + Math.random() * 2.5,
        color
      });
    }
  }


  /* =========================
     UPDATE
  ========================= */

  function update(dt) {

    // Particles + effects run even after death
    for (let i = particles.length - 1; i >= 0; i--) {

      const p = particles[i];

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 900 * dt;
      p.life -= dt;

      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = trail.length - 1; i >= 0; i--) {

      trail[i].life -= dt;
      trail[i].x -= speed * 0.35 * dt;

      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 46);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);

    wingTime += dt;

    if (state === "over") {

      deathTimer += dt;

      // Let the bird tumble to the floor for the classic look
      if (bird.y < H - GROUND_H - BIRD_R) {
        bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
        bird.y += bird.vy * dt;
        bird.rot = Math.min(Math.PI / 2, bird.rot + dt * 5);
      }

      return;
    }

    if (state === "menu") {

      // Gentle idle bob on the menu
      bird.y = H * 0.42 + Math.sin(performance.now() / 420) * 9;
      bird.rot = 0;
      groundOffset.value = (groundOffset.value + dt * 60) % 40;
      return;
    }

    if (state === "paused") return;

    groundOffset.value = (groundOffset.value + speed * dt) % 40;

    if (state === "ready") {

      // Hover until the first flap
      bird.y = H * 0.42 + Math.sin(performance.now() / 260) * 7;
      bird.vy = 0;
      movePipes(dt);
      return;
    }

    bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
    bird.y += bird.vy * dt;

    bird.rot = Math.max(-0.5, Math.min(1.25, bird.vy / 620));

    // Ceiling: bounce softly instead of dying
    if (bird.y < CEILING + BIRD_R) {
      bird.y = CEILING + BIRD_R;
      bird.vy = Math.max(bird.vy, 40);
    }

    movePipes(dt);

    // Ground
    if (bird.y + BIRD_R >= H - GROUND_H) {
      bird.y = H - GROUND_H - BIRD_R;
      die("ground");
      return;
    }

    checkPipes();
  }

  function movePipes(dt) {

    const dx = speed * dt;

    pipes.forEach(pipe => {
      pipe.x -= dx;
    });

    // Recycle + spawn
    while (pipes.length && pipes[0].x + PIPE_W < -40) pipes.shift();

    const last = pipes[pipes.length - 1];

    if (!last || last.x < W - spacing) {
      spawnPipe(Math.max(W + 20, (last ? last.x : W) + spacing));
    }
  }

  function checkPipes() {

    pipes.forEach(pipe => {

      const withinX = bird.x + BIRD_R > pipe.x && bird.x - BIRD_R < pipe.x + PIPE_W;

      if (withinX) {

        const top = pipe.gapY - pipe.gap / 2;
        const bottom = pipe.gapY + pipe.gap / 2;

        if (bird.y - BIRD_R < top || bird.y + BIRD_R > bottom) {
          die("pipe");
          return;
        }
      }

      if (!pipe.scored && pipe.x + PIPE_W < bird.x - BIRD_R) {
        pipe.scored = true;
        addScore();
      }
    });
  }


  /* =========================
     DRAWING
  ========================= */

  function drawSky() {

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#0a0c1e");
    sky.addColorStop(0.55, "#141033");
    sky.addColorStop(1, "#2a1140");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stars
    const t = performance.now() / 1000;

    stars.forEach(star => {

      const twinkle = 0.35 + 0.35 * Math.sin(t * 2 + star.phase);

      ctx.globalAlpha = twinkle;
      ctx.fillStyle = "#dfe8ff";

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;

    // Moon
    ctx.save();
    ctx.shadowColor = "rgba(255,225,180,.6)";
    ctx.shadowBlur = 40;
    ctx.fillStyle = "rgba(255,235,200,.92)";
    ctx.beginPath();
    ctx.arc(W - 78, 108, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSkyline() {

    const speeds = [0.06, 0.14, 0.26];
    const colors = [
      { fill: "#171436", edge: "rgba(122,47,255,.35)" },
      { fill: "#1d1740", edge: "rgba(47,120,255,.45)" },
      { fill: "#241a4d", edge: "rgba(241,7,163,.5)" }
    ];

    skyline.forEach((layer, index) => {

      const offset = (groundOffset.value * (speeds[index] * 12)) % layer.loop;

      const style = colors[index];

      ctx.save();

      for (let pass = -1; pass <= Math.ceil(W / layer.loop) + 1; pass++) {

        layer.forEach(building => {

          const x = building.x - offset + pass * layer.loop;

          if (x > W || x + building.w < 0) return;

          const y = building.y - building.h;

          ctx.fillStyle = style.fill;
          ctx.fillRect(x, y, building.w, building.h);

          ctx.strokeStyle = style.edge;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x + 0.5, y + 0.5, building.w - 1, building.h - 1);

          // Windows
          ctx.fillStyle = "rgba(255,235,180,.55)";

          building.windows.forEach(win => {
            if (!win.on) return;
            ctx.fillRect(x + win.x, y + win.y, 4, 6);
          });
        });
      }

      ctx.restore();
    });
  }

  function drawPipes() {

    pipes.forEach(pipe => {

      const top = pipe.gapY - pipe.gap / 2;
      const bottom = pipe.gapY + pipe.gap / 2;

      drawPipeBody(pipe.x, 0, PIPE_W, top, "up");
      drawPipeBody(pipe.x, bottom, PIPE_W, H - GROUND_H - bottom, "down");
    });
  }

  function drawPipeBody(x, y, w, h, side) {

    if (h <= 0) return;

    ctx.save();

    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, "#123055");
    grad.addColorStop(0.45, "#1d5c8f");
    grad.addColorStop(1, "#0e2440");

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    ctx.shadowColor = "rgba(80,200,255,.75)";
    ctx.shadowBlur = 20;
    ctx.strokeStyle = "rgba(120,220,255,.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);

    // Cap
    const capH = 26;
    const capY = side === "up" ? y + h - capH : y;

    ctx.shadowBlur = 24;
    ctx.strokeStyle = "rgba(160,240,255,.95)";
    ctx.lineWidth = 3;

    ctx.strokeRect(x - 6, capY + 1.5, w + 12, capH - 3);

    ctx.fillStyle = "rgba(20,60,100,.55)";
    ctx.fillRect(x - 6, capY, w + 12, capH);

    ctx.strokeRect(x - 6, capY + 1.5, w + 12, capH - 3);

    ctx.restore();
  }

  function drawGround() {

    ctx.save();

    ctx.fillStyle = "#0d0a20";
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

    // Neon edge
    ctx.shadowColor = "rgba(241,7,163,.8)";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#f107a3";
    ctx.fillRect(0, H - GROUND_H - 3, W, 3);

    ctx.shadowBlur = 0;

    // Moving dashes
    ctx.fillStyle = "rgba(255,255,255,.14)";

    for (let x = -40; x < W + 40; x += 40) {
      ctx.fillRect(x + (40 - groundOffset.value % 40), H - GROUND_H + 18, 22, 5);
    }

    ctx.fillStyle = "rgba(255,255,255,.09)";

    for (let x = -40; x < W + 40; x += 40) {
      ctx.fillRect(x + (40 - (groundOffset.value * 1.3) % 40), H - GROUND_H + 40, 14, 4);
    }

    ctx.restore();
  }

  function drawBird() {

    // Trail
    trail.forEach(p => {

      ctx.globalAlpha = Math.max(0, p.life / 0.4) * 0.5;
      ctx.fillStyle = "rgba(255,209,102,.9)";

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;

    ctx.save();

    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    ctx.shadowColor = "rgba(255,209,102,.85)";
    ctx.shadowBlur = 24;

    // Body
    const body = ctx.createRadialGradient(-5, -6, 3, 0, 0, BIRD_R + 4);
    body.addColorStop(0, "#fff4cf");
    body.addColorStop(1, "#ffb020");

    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Wing — beats after a flap
    const beat = Math.sin(Math.min(1, wingTime * 9) * Math.PI * 2);

    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath();
    ctx.ellipse(-4, 2 + beat * 3, 8, 5, -0.4 + beat * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "#ff7043";
    ctx.beginPath();
    ctx.moveTo(BIRD_R - 3, -2);
    ctx.lineTo(BIRD_R + 10, 2);
    ctx.lineTo(BIRD_R - 3, 6);
    ctx.closePath();
    ctx.fill();

    // Eye
    ctx.fillStyle = "#101223";
    ctx.beginPath();
    ctx.arc(5, -5, 3.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(6.2, -6.2, 1.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles() {

    particles.forEach(p => {

      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;
  }

  function drawScoreBadge() {

    if (state === "menu") return;

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "900 64px Inter, Arial, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.shadowColor = "rgba(0,0,0,.6)";
    ctx.shadowBlur = 12;

    ctx.fillText(String(score), W / 2, 92);

    ctx.restore();
  }

  function drawReady() {

    if (state !== "ready") return;

    ctx.save();

    ctx.textAlign = "center";

    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.font = "900 30px Inter, Arial, sans-serif";
    ctx.fillText("Get ready", W / 2, H * 0.24);

    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.font = "700 15px Inter, Arial, sans-serif";
    ctx.fillText("Tap to flap", W / 2, H * 0.24 + 30);

    // Animated hint arrow
    const bob = Math.sin(performance.now() / 300) * 6;

    ctx.strokeStyle = "rgba(255,209,102,.85)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(BIRD_X + 42, H * 0.42 + 34 + bob);
    ctx.lineTo(BIRD_X + 42, H * 0.42 - 6 + bob);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(BIRD_X + 34, H * 0.42 + 4 + bob);
    ctx.lineTo(BIRD_X + 42, H * 0.42 - 8 + bob);
    ctx.lineTo(BIRD_X + 50, H * 0.42 + 4 + bob);
    ctx.stroke();

    ctx.restore();
  }

  function draw() {

    ctx.save();

    if (shake > 0) {
      ctx.translate(
        (Math.random() * 2 - 1) * shake,
        (Math.random() * 2 - 1) * shake
      );
    }

    drawSky();
    drawSkyline();
    drawPipes();
    drawGround();

    if (state !== "menu") drawParticles();

    drawBird();
    drawScoreBadge();
    drawReady();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.5) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }


  /* =========================
     LOOP
  ========================= */

  function advance(ms) {

    accumulator += ms / 1000;

    let guard = 0;

    while (accumulator >= STEP && guard++ < 700) {
      update(STEP);
      accumulator -= STEP;
    }
  }

  function frame(time) {

    if (!lastTime) lastTime = time;

    const delta = Math.min(time - lastTime, 120);

    lastTime = time;

    if (state !== "paused") advance(delta);

    draw();

    requestAnimationFrame(frame);
  }


  /* =========================
     UI
  ========================= */

  const uiCache = {};

  function setText(key, el, value) {
    if (uiCache[key] === value) return;
    uiCache[key] = value;
    el.textContent = value;
  }

  function updateUI() {

    setText("score", scoreEl, score);
    setText("best", bestEl, best);

    const medal = medalFor(score);

    setText("medalLabel", medalLabelEl, medal ? medal.label : "No medal yet");

    const icon = medal ? "🏅" : "—";

    if (uiCache.medal !== icon + (medal ? medal.key : "")) {
      uiCache.medal = icon + (medal ? medal.key : "");
      medalIconEl.textContent = icon;
      medalIconEl.className = "medal" + (medal ? " " + medal.key : "");
    }

    setText("gap", gapLabelEl, Math.round(gap) + " px");

    ladderEl.querySelectorAll("div").forEach(el => {
      const need = parseInt(el.dataset.need || "0", 10);
      el.classList.toggle("on", best >= need);
    });
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function pause() {

    if (state !== "play" && state !== "ready") return;

    state = "paused";

    ovTitle.textContent = "Paused";
    ovText.textContent = "Nothing is moving until you are.";
    ovFinal.style.display = "none";
    ovBtn.textContent = "Resume";

    overlay.classList.add("show");
  }

  function resume() {

    if (state !== "paused") return;

    state = "play";

    lastTime = performance.now();
    accumulator = 0;

    hideOverlay();
  }


  /* =========================
     INPUT
  ========================= */

  document.addEventListener("keydown", event => {

    const key = event.key.toLowerCase();

    if (key === " " || key === "arrowup" || key === "w") {

      event.preventDefault();

      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }

      flap();
      return;
    }

    if (key === "enter") {
      startRun();
      return;
    }

    if (key === "p" || key === "escape") {
      if (state === "paused") resume();
      else pause();
    }
  });

  fieldEl.addEventListener("pointerdown", event => {
    event.preventDefault();
    flap();
  });

  (function bindControls() {

    const controls = document.getElementById("controls");

    controls.addEventListener("pointerdown", event => {

      const button = event.target.closest("button");

      if (!button) return;

      event.preventDefault();

      if (button.dataset.act === "flap") flap();
      else if (state === "paused") resume();
      else pause();
    });
  })();

  ovBtn.addEventListener("click", () => {

    if (state === "paused") {
      resume();
      return;
    }

    startRun();
  });

  muteEl.addEventListener("click", () => {
    muted = !muted;
    saveMuted(muted);
    updateMuteButton();
  });


  /* =========================
     EVENTS + START
  ========================= */

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 250));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      pause();
    } else {
      lastTime = performance.now();
    }
  });

  if (
    ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
    window.matchMedia("(pointer: coarse)").matches
  ) {
    document.body.classList.add("touch");
  }

  buildBackdrop();
  layout();
  updateMuteButton();
  resetRun();
  updateUI();

  state = "menu";

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layout).catch(() => {});
  }

  requestAnimationFrame(frame);


  /* =========================
     TEST HOOKS
  ========================= */

  window.gameAPI = {
    get state() { return state; },
    get score() { return score; },
    get best() { return best; },
    get gap() { return gap; },
    get speed() { return speed; },
    get bird() { return bird; },
    get pipes() { return pipes; },
    get medal() { return medalFor(score); },
    step(ms) { advance(ms); },
    start() { startRun(); },
    flap,
    pause,
    resume,
    forceDie() { die("pipe"); },
    CONST: { W, H, GROUND_H, BIRD_R, PIPE_W, BIRD_X }
  };

})();

</script>

</body>
</html>

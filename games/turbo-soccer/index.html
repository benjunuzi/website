<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>Turbo Soccer ⚽ · ben.junuzi.com</title>
<link rel="icon" href="../../logo-mark.svg">
<link rel="apple-touch-icon" href="../../logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #04060d;
    --panel: rgba(255,255,255,.045);
    --line: rgba(255,255,255,.10);
    --text: #e9eef9;
    --muted: #93a0c4;
    --accent: #2f7bff;
    --accent2: #4aa8ff;
    --you: #4aa8ff;
    --cpu: #ff5f6d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 78% -10%, rgba(20,180,110,.18), transparent 62%),
      radial-gradient(760px 480px at -6% 28%, rgba(47,120,255,.18), transparent 62%),
      radial-gradient(700px 460px at 60% 112%, rgba(255,95,109,.12), transparent 62%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent); color: #04060d; }

  .app {
    margin: auto;
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px 7px 9px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: border-color .18s ease, transform .18s ease;
  }
  .brand:hover { border-color: rgba(79,140,255,.65); transform: translateY(-1px); }
  .brand img { width: 22px; height: 22px; display: block; }

  .title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 14px;
    width: 100%;
  }

  .field {
    position: relative;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.11);
    background: rgba(6,14,12,.94);
    box-shadow:
      0 22px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(20,180,110,.14),
      0 0 70px rgba(20,180,110,.10);
    overflow: hidden;
    touch-action: none;
  }
  .field canvas { display: block; width: 100%; height: 100%; }

  .hud {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 176px;
    flex: 0 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 11px 10px;
    backdrop-filter: blur(8px);
    min-width: 0;
  }

  .k {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .v {
    margin-top: 2px;
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .v.small { font-size: 15px; }

  .side-score { display: flex; gap: 8px; }
  .side-score .panel { flex: 1 1 0; text-align: center; }
  .side-score .you .v { color: var(--you); }
  .side-score .cpu .v { color: var(--cpu); }

  .power {
    margin-top: 7px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.09);
    overflow: hidden;
  }
  .power i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #26d07c, #ffe066, #ff5f6d);
    transition: width .05s linear;
  }

  .keys {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    padding: 0 2px;
  }
  .keys b { color: #dbe6ff; font-weight: 700; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    padding: 18px;
    background: linear-gradient(180deg, rgba(4,6,13,.7), rgba(4,6,13,.9));
    backdrop-filter: blur(4px);
    text-align: center;
  }
  .overlay.show { display: grid; }
  .overlay h2 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4.6vw, 34px);
    font-weight: 900;
  }
  .overlay p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.55; }

  .btn {
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    padding: 11px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #14b46e, #2fd88b);
    box-shadow: 0 10px 26px rgba(20,180,110,.4), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }

  .btn.ghost {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost.active {
    border-color: rgba(47,216,139,.75);
    background: rgba(20,180,110,.22);
  }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  .controls {
    display: none;
    width: 100%;
    max-width: 520px;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    touch-action: none;
  }
  .controls button {
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 0;
    min-height: 50px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .controls button:active { transform: scale(.96); border-color: rgba(47,216,139,.7); }
  .controls button.shoot {
    grid-column: span 2;
    background: linear-gradient(135deg, #14b46e, #2fd88b);
    border-color: transparent;
    box-shadow: 0 8px 22px rgba(20,180,110,.35);
  }

  body.touch .controls { display: grid; }
  body.touch .keys { display: none; }

  .credit {
    font-size: 11px;
    color: #6f7ea3;
    text-align: center;
  }
  .credit a { color: #9fb6e8; text-decoration: none; border-bottom: 1px solid rgba(159,182,232,.35); }
  .credit a:hover { color: #cfe1ff; }

  .mute {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .mute:hover { border-color: rgba(79,140,255,.65); }

  @media (max-width: 760px) {
    .stage { flex-direction: column; align-items: center; gap: 12px; }
    .hud { width: 100%; max-width: 520px; flex-direction: row; flex-wrap: wrap; }
    .hud .side-score { flex: 1 1 140px; }
    .hud .panel.grow { flex: 1 1 110px; }
    .k { font-size: 8px; letter-spacing: .1em; }
    .v { font-size: 17px; }
    .title { display: none; }
  }
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <a class="brand" href="../../index.html">
      <img src="../../logo-mark.svg" alt="">
      ben.junuzi.com
    </a>
    <div class="title">⚽ Turbo Soccer</div>
    <button class="mute" id="mute" title="Toggle sound">🔊</button>
  </header>

  <main class="stage">

    <div class="field" id="field">
      <canvas id="pitch"></canvas>

      <div class="overlay show" id="overlay">
        <div>
          <h2 id="ovTitle">Turbo Soccer</h2>
          <p id="ovText">90 seconds on the clock. Dribble into space, charge your shot, and beat the keeper.</p>
          <div class="btn-row" id="ovChoices">
            <button class="btn ghost" data-diff="easy">Easy</button>
            <button class="btn ghost active" data-diff="normal">Normal</button>
            <button class="btn ghost" data-diff="hard">Hard</button>
          </div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn" id="ovBtn">Kick off</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="hud">
      <div class="side-score">
        <div class="panel you">
          <div class="k">You</div>
          <div class="v" id="scoreYou">0</div>
        </div>
        <div class="panel cpu">
          <div class="k">CPU</div>
          <div class="v" id="scoreCpu">0</div>
        </div>
      </div>

      <div class="panel grow">
        <div class="k">Time</div>
        <div class="v" id="clock">1:30</div>
      </div>

      <div class="panel grow">
        <div class="k">Shot power</div>
        <div class="v small" id="powerLabel">Hold to charge</div>
        <div class="power"><i id="powerBar"></i></div>
      </div>

      <div class="panel grow">
        <div class="k">Difficulty</div>
        <div class="v small" id="diffLabel">Normal</div>
      </div>

      <div class="keys">
        <span><b>WASD / ↑↓←→</b> run</span>
        <span><b>Space</b> charge &amp; shoot</span>
        <span><b>P</b> pause</span>
        <span><b>Enter</b> new match</span>
      </div>
    </aside>

  </main>

  <div class="controls" id="controls">
    <button data-act="up">↑</button>
    <button data-act="left">←</button>
    <button data-act="right">→</button>
    <button data-act="down">↓</button>
    <button data-act="shoot" class="shoot">Shoot</button>
    <button data-act="pause">Pause</button>
  </div>

  <div class="credit">
    Part of <a href="../../index.html">ben.junuzi.com</a> · ⚽ Turbo Soccer
  </div>

</div>

<script>
"use strict";

(function () {

  /* =========================
     CONSTANTS
  ========================= */

  const W = 1000;
  const H = 620;

  const GOAL_DEPTH = 40;      // how far the net sits behind the goal line
  const PITCH = { x0: 62, y0: 40, x1: W - 62, y1: H - 40 };
  const CX = W / 2;
  const CY = H / 2;

  const MOUTH = 176;          // goal opening height

  const PLAYER_R = 18;
  const KEEPER_R = 19;
  const BALL_R = 10;

  const RUN_SPEED = 300;
  const AI_SPEED = { easy: 232, normal: 286, hard: 336 };
  const KEEPER_SPEED = { easy: 236, normal: 300, hard: 360 };

  const POSSESS_RANGE = 30;
  const DRIBBLE_AHEAD = 27;

  const SHOT_MIN = 620;
  const SHOT_MAX = 1180;
  const CHARGE_TIME = 0.85;

  const MATCH_SECONDS = 90;

  // Must match .app { max-width } in the stylesheet
  const APP_MAX = 1000;

  const COLORS = {
    you: "#4aa8ff",
    cpu: "#ff5f6d",
    keeperYou: "#8fd0ff",
    keeperCpu: "#ffb0b6",
    ball: "#ffffff"
  };


  /* =========================
     DOM
  ========================= */

  const fieldEl = document.getElementById("field");
  const canvas = document.getElementById("pitch");
  const ctx = canvas.getContext("2d");

  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovBtn = document.getElementById("ovBtn");
  const ovChoices = document.getElementById("ovChoices");

  const scoreYouEl = document.getElementById("scoreYou");
  const scoreCpuEl = document.getElementById("scoreCpu");
  const clockEl = document.getElementById("clock");
  const powerBarEl = document.getElementById("powerBar");
  const powerLabelEl = document.getElementById("powerLabel");
  const diffLabelEl = document.getElementById("diffLabel");
  const muteEl = document.getElementById("mute");


  /* =========================
     SOUND
  ========================= */

  let audioCtx = null;
  let muted = loadMuted();

  function loadMuted() {
    try { return localStorage.getItem("soccer.muted") === "1"; } catch (err) { return false; }
  }
  function saveMuted(v) {
    try { localStorage.setItem("soccer.muted", v ? "1" : "0"); } catch (err) {}
  }

  function beep(freq, duration, type = "square", gain = 0.05, slideTo) {

    if (muted) return;

    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }

      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      }

      amp.gain.setValueAtTime(gain, audioCtx.currentTime);
      amp.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      osc.connect(amp);
      amp.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);

    } catch (err) {}
  }

  function updateMuteButton() {
    muteEl.textContent = muted ? "🔇" : "🔊";
  }


  /* =========================
     STATE
  ========================= */

  let state = "menu";       // menu | kickoff | play | goal | paused | fulltime
  let difficulty = "normal";

  let scoreYou = 0;
  let scoreCpu = 0;

  let timeLeft = MATCH_SECONDS;
  let celebration = 0;
  let lastScorer = null;

  let charge = 0;
  let charging = false;

  let shake = 0;
  let particles = [];
  let flash = 0;

  let owner = null;         // null | 0 (you) | 1 (cpu)
  let ownerLock = 0;
  let kickLock = 0;

  let view = { scale: 1, ox: 0, oy: 0 };

  const ball = {
    x: CX,
    y: CY,
    vx: 0,
    vy: 0,
    spin: 0
  };

  const you = {
    x: CX - 220,
    y: CY,
    vx: 0,
    vy: 0,
    face: { x: 1, y: 0 },
    team: 0
  };

  const cpu = {
    x: CX + 220,
    y: CY,
    vx: 0,
    vy: 0,
    face: { x: -1, y: 0 },
    team: 1,
    decisionTimer: 0,
    aimY: CY,
    route: 0
  };

  const keepers = [
    { x: PITCH.x0 + 34, y: CY, vy: 0, team: 0 },
    { x: PITCH.x1 - 34, y: CY, vy: 0, team: 1 }
  ];

  const keys = new Set();
  const stick = { up: false, down: false, left: false, right: false };
  let shootHeld = false;

  let lastTime = 0;
  let accumulator = 0;

  const STEP = 1 / 120;


  /* =========================
     LAYOUT
  ========================= */

  function layout() {

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const compact = vw <= 760;

    const hudW = compact ? 0 : 176;
    const gap = compact ? 0 : 14;

    const topbar = document.querySelector(".topbar");
    const credit = document.querySelector(".credit");
    const controls = document.getElementById("controls");

    const controlsVisible = getComputedStyle(controls).display !== "none";

    const chrome =
      topbar.offsetHeight +
      credit.offsetHeight +
      (controlsVisible ? controls.offsetHeight : 0) +
      (compact ? 118 : 34) +
      32;

    const availW = Math.min(vw - 32, APP_MAX) - hudW - gap;
    const availH = vh - chrome;

    let w = Math.min(availW, availH * (W / H));

    w = Math.max(compact ? 300 : 380, Math.min(w, 1000));

    const h = w * (H / W);

    fieldEl.style.width = Math.round(w) + "px";
    fieldEl.style.height = Math.round(h) + "px";

    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    const scale = Math.min(w / W, h / H);

    view = { scale, ox: (w - W * scale) / 2, oy: (h - H * scale) / 2 };

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * view.ox, dpr * view.oy);
  }


  /* =========================
     MATCH FLOW
  ========================= */

  function resetPositions(kickoffTeam) {

    ball.x = CX;
    ball.y = CY;
    ball.vx = 0;
    ball.vy = 0;

    owner = null;
    ownerLock = 0;
    kickLock = 0;
    charge = 0;
    charging = false;

    you.x = CX - (kickoffTeam === 0 ? 60 : 240);
    you.y = CY;
    you.vx = 0;
    you.vy = 0;
    you.face = { x: 1, y: 0 };

    cpu.x = CX + (kickoffTeam === 1 ? 60 : 240);
    cpu.y = CY;
    cpu.vx = 0;
    cpu.vy = 0;
    cpu.face = { x: -1, y: 0 };
    cpu.route = 0;

    keepers[0].y = CY;
    keepers[1].y = CY;

    state = "kickoff";
    celebration = 0.75;
  }

  function newMatch() {

    scoreYou = 0;
    scoreCpu = 0;
    timeLeft = MATCH_SECONDS;
    particles = [];
    lastScorer = null;

    resetPositions(Math.random() < 0.5 ? 0 : 1);

    hideOverlay();
    updateUI();
  }

  function scoreGoal(team) {

    if (team === 0) {
      scoreYou++;
      burstAt(PITCH.x1 + 12, ball.y, COLORS.you, 34);
      beep(520, 0.16, "square", 0.06);
      setTimeout(() => beep(660, 0.16, "square", 0.06), 120);
      setTimeout(() => beep(880, 0.24, "square", 0.06), 240);
    } else {
      scoreCpu++;
      burstAt(PITCH.x0 - 12, ball.y, COLORS.cpu, 34);
      beep(300, 0.18, "sawtooth", 0.055, 180);
    }

    lastScorer = team;

    flash = 1;
    shake = 14;

    updateUI();

    if (scoreYou >= 9 || scoreCpu >= 9 || timeLeft <= 0) {
      fullTime();
      return;
    }

    state = "goal";
    celebration = 1.6;
  }

  function fullTime() {

    state = "fulltime";

    let title, text;

    if (scoreYou > scoreCpu) {
      title = "You win! 🏆";
      text = "Final score " + scoreYou + " – " + scoreCpu + ".";
      beep(660, 0.16, "square", 0.06);
      setTimeout(() => beep(880, 0.26, "square", 0.06), 150);
    } else if (scoreCpu > scoreYou) {
      title = "CPU wins 🤖";
      text = "Final score " + scoreYou + " – " + scoreCpu + ". Run it back?";
      beep(300, 0.3, "sawtooth", 0.055, 200);
    } else {
      title = "All square 🤝";
      text = "Final score " + scoreYou + " – " + scoreCpu + ".";
      beep(440, 0.3, "triangle", 0.05);
    }

    showOverlay(title, text + " Time played: 90 seconds.", "New match");
  }


  /* =========================
     INPUT HELPERS
  ========================= */

  function inputVector() {

    let x = 0;
    let y = 0;

    if (keys.has("arrowleft") || keys.has("a") || stick.left) x -= 1;
    if (keys.has("arrowright") || keys.has("d") || stick.right) x += 1;
    if (keys.has("arrowup") || keys.has("w") || stick.up) y -= 1;
    if (keys.has("arrowdown") || keys.has("s") || stick.down) y += 1;

    const len = Math.hypot(x, y);

    if (len > 0) {
      x /= len;
      y /= len;
    }

    return { x, y, len: len > 0 ? 1 : 0 };
  }

  function clampToPitch(entity, r) {

    entity.x = Math.max(PITCH.x0 + r, Math.min(PITCH.x1 - r, entity.x));
    entity.y = Math.max(PITCH.y0 + r, Math.min(PITCH.y1 - r, entity.y));
  }


  /* =========================
     PLAYER MOVEMENT
  ========================= */

  function moveYou(dt) {

    const input = inputVector();

    const targetVx = input.x * RUN_SPEED;
    const targetVy = input.y * RUN_SPEED;

    // Snappy acceleration, quick stop
    const accel = 12;

    you.vx += (targetVx - you.vx) * Math.min(1, accel * dt);
    you.vy += (targetVy - you.vy) * Math.min(1, accel * dt);

    you.x += you.vx * dt;
    you.y += you.vy * dt;

    if (input.len > 0) {
      you.face = { x: input.x, y: input.y };
    } else if (owner === 0) {
      // Aim at the goal when standing still with the ball
      const dx = PITCH.x1 - you.x;
      const dy = CY - you.y;
      const len = Math.hypot(dx, dy) || 1;
      you.face = { x: dx / len, y: dy / len };
    }

    clampToPitch(you, PLAYER_R);
  }


  /* =========================
     CPU BRAIN
  ========================= */

  function moveCpu(dt) {

    const speed = AI_SPEED[difficulty];

    let targetX;
    let targetY;

    cpu.decisionTimer -= dt;

    if (owner !== 1) cpu.route = 0;

    if (owner === 1) {

      // Carrying the ball: drive at the goal, shoot when in range.
      // Aim for the corner the keeper is furthest from.
      const keeperY = keepers[0].y;

      cpu.aimY = keeperY < CY ? CY + MOUTH * 0.34 : CY - MOUTH * 0.34;

      targetX = PITCH.x0 + 70;
      targetY = cpu.aimY;

      // Shoot at the far corner of the goal, straight at the net rather than
      // wherever the CPU happens to be facing.
      const goalX = PITCH.x0 + 6;
      const goalY = cpu.aimY;

      const distance = Math.hypot(ball.x - goalX, ball.y - goalY);
      const aligned = Math.abs(ball.y - CY) < MOUTH * 0.6;

      if (
        distance < 330 &&
        aligned &&
        cpu.face.x < -0.35 &&
        cpu.decisionTimer <= 0
      ) {
        const dx = goalX - ball.x;
        const dy = goalY - ball.y;
        const len = Math.hypot(dx, dy) || 1;

        shootAt(1, 0.85 + Math.random() * 0.15, { x: dx / len, y: dy / len });

        cpu.decisionTimer = 0.5;
      }

      // Defenders can't be pushed through, so commit to a detour: slide
      // sideways until clear, then carry on toward the goal.
      const blocked =
        you.x < cpu.x &&
        cpu.x - you.x < 190 &&
        Math.abs(you.y - cpu.y) < 110;

      if (!cpu.route && blocked) {
        cpu.route = cpu.y >= you.y ? 1 : -1;
      }

      if (cpu.route) {

        if (Math.abs(you.y - cpu.y) > 108 || you.x > cpu.x) {
          cpu.route = 0;
        } else {
          targetY = Math.max(
            PITCH.y0 + PLAYER_R + 4,
            Math.min(PITCH.y1 - PLAYER_R - 4, you.y + cpu.route * 124)
          );

          targetX = cpu.x;   // step around first, then advance
        }
      }

    } else if (owner === 0) {

      // Chase back between the ball and our own goal
      targetX = ball.x + 55;
      targetY = ball.y;

    } else {

      // Contest the ball — approach from the goal side so it can run onto it
      targetX = ball.x + 34;
      targetY = ball.y;
    }

    if (cpu.decisionTimer <= 0 && Math.random() < 0.02) {
      cpu.aimY = CY + (Math.random() * 2 - 1) * 90;
    }

    const dx = targetX - cpu.x;
    const dy = targetY - cpu.y;

    const dist = Math.hypot(dx, dy) || 1;

    const wantX = (dx / dist) * speed;
    const wantY = (dy / dist) * speed;

    const accel = 9;

    cpu.vx += (wantX - cpu.vx) * Math.min(1, accel * dt);
    cpu.vy += (wantY - cpu.vy) * Math.min(1, accel * dt);

    cpu.x += cpu.vx * dt;
    cpu.y += cpu.vy * dt;

    if (Math.hypot(cpu.vx, cpu.vy) > 20) {
      const len = Math.hypot(cpu.vx, cpu.vy);
      cpu.face = { x: cpu.vx / len, y: cpu.vy / len };
    }

    clampToPitch(cpu, PLAYER_R);
  }


  /* =========================
     KEEPERS
  ========================= */

  // Strikers shove each other instead of passing through one another
  function separateStrikers() {

    const dx = cpu.x - you.x;
    const dy = cpu.y - you.y;

    const dist = Math.hypot(dx, dy);
    const minDist = PLAYER_R * 2;

    if (dist >= minDist || dist < 0.001) return;

    const push = (minDist - dist) / 2;
    const nx = dx / dist;
    const ny = dy / dist;

    cpu.x += nx * push;
    cpu.y += ny * push;

    you.x -= nx * push;
    you.y -= ny * push;

    clampToPitch(you, PLAYER_R);
    clampToPitch(cpu, PLAYER_R);
  }

  function moveKeepers(dt) {

    const speed = KEEPER_SPEED[difficulty];

    keepers.forEach((keeper, index) => {

      const mouthTop = CY - MOUTH / 2 + KEEPER_R;
      const mouthBottom = CY + MOUTH / 2 - KEEPER_R;

      // Keepers cheat a little toward the ball's line of travel
      let targetY = ball.y;

      if (index === 0 && ball.vx > 0) targetY = ball.y + ball.vy * 0.12;
      if (index === 1 && ball.vx < 0) targetY = ball.y + ball.vy * 0.12;

      targetY = Math.max(mouthTop, Math.min(mouthBottom, targetY));

      const diff = targetY - keeper.y;
      const step = Math.max(-speed * dt, Math.min(speed * dt, diff));

      keeper.y += step;
      keeper.vy = step / dt;

      // Rush out a touch when the ball is very close
      const rush = Math.abs(ball.x - keeper.x) < 90 ? 16 : 0;

      const homeX = index === 0 ? PITCH.x0 + 34 : PITCH.x1 - 34;

      const wantX = index === 0
        ? homeX + (ball.x < keeper.x ? rush : 0)
        : homeX - (ball.x > keeper.x ? rush : 0);

      keeper.x += (wantX - keeper.x) * Math.min(1, 6 * dt);
    });
  }


  /* =========================
     BALL + POSSESSION
  ========================= */

  function makeShot(power, dirOverride) {

    let dir = owner === 0 ? you.face : cpu.face;

    if (dirOverride) dir = dirOverride;

    const p = SHOT_MIN + (SHOT_MAX - SHOT_MIN) * power;

    ball.vx = dir.x * p;
    ball.vy = dir.y * p + (Math.random() * 40 - 20);

    owner = null;
    ownerLock = 0.22;
    kickLock = 0.18;

    charge = 0;
    charging = false;

    shake = Math.max(shake, 5 + power * 5);

    beep(240, 0.08, "square", 0.05 + power * 0.04, 160);

    updateUI();
  }

  function shoot(team, power) {

    if (owner !== team) return;

    makeShot(Math.max(0, Math.min(1, power)));
  }

  function shootAt(team, power, dir) {

    if (owner !== team) return;

    makeShot(Math.max(0, Math.min(1, power)), dir);
  }

  function updatePossession(dt) {

    if (ownerLock > 0) ownerLock -= dt;
    if (kickLock > 0) kickLock -= dt;

    const ballSpeed = Math.hypot(ball.vx, ball.vy);

    const dYou = Math.hypot(ball.x - you.x, ball.y - you.y);
    const dCpu = Math.hypot(ball.x - cpu.x, ball.y - cpu.y);

    if (kickLock <= 0 && ballSpeed < 760) {

      const inRange = [];

      if (dYou < POSSESS_RANGE + PLAYER_R) inRange.push(0);
      if (dCpu < POSSESS_RANGE + PLAYER_R) inRange.push(1);

      if (inRange.length > 0) {

        const next = inRange.length === 1
          ? inRange[0]
          : (dYou <= dCpu ? 0 : 1);

        if (owner === null) {
          owner = next;
          ownerLock = 0.25;
        } else if (owner !== next && ownerLock <= 0) {
          owner = next;
          ownerLock = 0.25;
        }
      }
    }

    if (owner !== null) {

      const holder = owner === 0 ? you : cpu;

      const ahead = DRIBBLE_AHEAD + (charging ? 6 : 0);

      const targetX = holder.x + holder.face.x * ahead;
      const targetY = holder.y + holder.face.y * ahead;

      // Spring the ball toward the sweet spot in front of the carrier
      const k = 30;

      ball.vx += (targetX - ball.x) * k * dt;
      ball.vy += (targetY - ball.y) * k * dt;

      const damp = Math.exp(-7 * dt);

      ball.vx *= damp;
      ball.vy *= damp;
    }
  }

  function ballEntityCollisions() {

    const bodies = [you, cpu, keepers[0], keepers[1]];

    bodies.forEach(body => {

      const isKeeper = body === keepers[0] || body === keepers[1];

      // While a striker is carrying the ball, don't body-check it away from them
      const carrier = owner === 0 ? you : (owner === 1 ? cpu : null);

      if (!isKeeper && body === carrier) return;

      const r = isKeeper ? KEEPER_R : PLAYER_R;

      const dx = ball.x - body.x;
      const dy = ball.y - body.y;

      const dist = Math.hypot(dx, dy);
      const minDist = r + BALL_R;

      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;

      ball.x = body.x + nx * minDist;
      ball.y = body.y + ny * minDist;

      const speed = Math.hypot(ball.vx, ball.vy);

      // Keepers boot it clear instead of letting it roll in
      if (isKeeper) {

        const dir = body.team === 0 ? 1 : -1;

        ball.vx = dir * (620 + Math.random() * 220);
        ball.vy = (Math.random() * 2 - 1) * 340;

        owner = null;
        kickLock = 0.25;

        beep(180, 0.09, "square", 0.045, 120);
        shake = Math.max(shake, 6);
        return;
      }

      // Deflect, carrying the player's momentum
      const bodySpeed = Math.hypot(body.vx, body.vy);

      const deflect = Math.max(120, speed * 0.55) + bodySpeed * 0.6;

      ball.vx = nx * deflect + body.vx * 0.5;
      ball.vy = ny * deflect + body.vy * 0.5;

      if (bodySpeed > 60) {
        beep(150, 0.05, "square", 0.035);
      }
    });

    // Goal posts
    const posts = [
      { x: PITCH.x0, y: CY - MOUTH / 2 },
      { x: PITCH.x0, y: CY + MOUTH / 2 },
      { x: PITCH.x1, y: CY - MOUTH / 2 },
      { x: PITCH.x1, y: CY + MOUTH / 2 }
    ];

    posts.forEach(post => {

      const dx = ball.x - post.x;
      const dy = ball.y - post.y;

      const dist = Math.hypot(dx, dy);
      const minDist = BALL_R + 5;

      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;

      ball.x = post.x + nx * minDist;
      ball.y = post.y + ny * minDist;

      const dot = ball.vx * nx + ball.vy * ny;

      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;

      ball.vx *= 0.85;
      ball.vy *= 0.85;

      beep(900, 0.05, "triangle", 0.035);
      shake = Math.max(shake, 5);
    });
  }

  function stepBall(dt) {

    updatePossession(dt);

    const speed = Math.hypot(ball.vx, ball.vy);

    const steps = Math.max(1, Math.ceil((speed * dt) / (BALL_R * 0.7)));

    const sdt = dt / steps;

    for (let i = 0; i < steps; i++) {

      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      if (owner === null) {
        const damp = Math.exp(-0.85 * sdt);
        ball.vx *= damp;
        ball.vy *= damp;
      }

      ballEntityCollisions();

      // Side walls (above and below the goal mouth)
      if (ball.y - BALL_R < PITCH.y0) {
        ball.y = PITCH.y0 + BALL_R;
        ball.vy = Math.abs(ball.vy) * 0.82;
      } else if (ball.y + BALL_R > PITCH.y1) {
        ball.y = PITCH.y1 - BALL_R;
        ball.vy = -Math.abs(ball.vy) * 0.82;
      }

      // Back walls behind the goals
      if (ball.x - BALL_R < PITCH.x0 - GOAL_DEPTH) {
        ball.x = PITCH.x0 - GOAL_DEPTH + BALL_R;
        ball.vx = Math.abs(ball.vx) * 0.6;
      } else if (ball.x + BALL_R > PITCH.x1 + GOAL_DEPTH) {
        ball.x = PITCH.x1 + GOAL_DEPTH - BALL_R;
        ball.vx = -Math.abs(ball.vx) * 0.6;
      }

      // End walls outside the mouth
      if (ball.x - BALL_R < PITCH.x0 && Math.abs(ball.y - CY) > MOUTH / 2) {
        ball.x = PITCH.x0 + BALL_R;
        ball.vx = Math.abs(ball.vx) * 0.82;
      } else if (ball.x + BALL_R > PITCH.x1 && Math.abs(ball.y - CY) > MOUTH / 2) {
        ball.x = PITCH.x1 - BALL_R;
        ball.vx = -Math.abs(ball.vx) * 0.82;
      }

      // Goals
      if (ball.x - BALL_R <= PITCH.x0 && Math.abs(ball.y - CY) < MOUTH / 2 - 2) {
        scoreGoal(1);
        return;
      }

      if (ball.x + BALL_R >= PITCH.x1 && Math.abs(ball.y - CY) < MOUTH / 2 - 2) {
        scoreGoal(0);
        return;
      }
    }

    ball.spin += Math.hypot(ball.vx, ball.vy) * dt * 0.02;
  }


  /* =========================
     PARTICLES
  ========================= */

  function burstAt(x, y, color, count) {

    for (let i = 0; i < count; i++) {

      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 340;

      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.6 + Math.random() * 0.7,
        size: 2 + Math.random() * 3,
        color
      });
    }
  }

  function stepParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

      const p = particles[i];

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.exp(-1.6 * dt);
      p.vy = p.vy * Math.exp(-1.6 * dt) + 380 * dt;
      p.life -= dt;

      if (p.life <= 0) particles.splice(i, 1);
    }
  }


  /* =========================
     UPDATE
  ========================= */

  function update(dt) {

    stepParticles(dt);

    if (shake > 0) shake = Math.max(0, shake - dt * 42);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);

    if (state === "goal") {

      celebration -= dt;

      if (celebration <= 0) {
        resetPositions(lastScorer === 0 ? 1 : 0);
      }

      return;
    }

    if (state !== "play" && state !== "kickoff") return;

    if (state === "kickoff") {
      // Short beat before the ball is live
      celebration -= dt;
      moveYou(dt * 0.4);
      if (celebration <= 0) state = "play";
      return;
    }

    timeLeft -= dt;

    if (timeLeft <= 0) {
      timeLeft = 0;
      fullTime();
      return;
    }

    moveYou(dt);
    moveCpu(dt);
    separateStrikers();
    moveKeepers(dt);
    stepBall(dt);

    // Charging a shot
    if (charging && owner === 0) {
      charge = Math.min(1, charge + dt / CHARGE_TIME);
    }

    updateUI();
  }


  /* =========================
     DRAWING
  ========================= */

  function drawPitch() {

    ctx.fillStyle = "#0a1a14";
    ctx.fillRect(0, 0, W, H);

    // Mown stripes
    const stripes = 10;
    const stripeW = W / stripes;

    for (let i = 0; i < stripes; i++) {

      ctx.fillStyle = i % 2 === 0
        ? "rgba(38,208,124,.055)"
        : "rgba(38,208,124,.02)";

      ctx.fillRect(i * stripeW, 0, stripeW, H);
    }

    // Pitch edge
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.lineWidth = 3;

    ctx.strokeRect(
      PITCH.x0,
      PITCH.y0,
      PITCH.x1 - PITCH.x0,
      PITCH.y1 - PITCH.y0
    );

    // Halfway line + centre circle
    ctx.beginPath();
    ctx.moveTo(CX, PITCH.y0);
    ctx.lineTo(CX, PITCH.y1);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CX, CY, 78, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(CX, CY, 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fill();

    // Penalty boxes
    const boxH = 300;
    const boxW = 118;

    ctx.strokeRect(PITCH.x0, CY - boxH / 2, boxW, boxH);
    ctx.strokeRect(PITCH.x1 - boxW, CY - boxH / 2, boxW, boxH);

    const sixH = 168;
    const sixW = 52;

    ctx.strokeRect(PITCH.x0, CY - sixH / 2, sixW, sixH);
    ctx.strokeRect(PITCH.x1 - sixW, CY - sixH / 2, sixW, sixH);

    // Goals (nets)
    drawGoal(PITCH.x0 - GOAL_DEPTH, PITCH.x0, CY - MOUTH / 2, MOUTH, "left");
    drawGoal(PITCH.x1, PITCH.x1 + GOAL_DEPTH, CY - MOUTH / 2, MOUTH, "right");

    // Goal mouth markers
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(PITCH.x0, CY - MOUTH / 2);
    ctx.lineTo(PITCH.x0, CY + MOUTH / 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(PITCH.x1, CY - MOUTH / 2);
    ctx.lineTo(PITCH.x1, CY + MOUTH / 2);
    ctx.stroke();
  }

  function drawGoal(x0, x1, y0, height, side) {

    ctx.save();

    ctx.fillStyle = "rgba(10,20,30,.9)";
    ctx.fillRect(x0, y0, x1 - x0, height);

    ctx.strokeStyle = "rgba(255,255,255,.28)";
    ctx.lineWidth = 1;

    for (let x = x0; x <= x1; x += 8) {
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, y0 + height);
      ctx.stroke();
    }

    for (let y = y0; y <= y0 + height; y += 8) {
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(255,255,255,.65)";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(side === "left" ? x1 : x0, y0);
    ctx.lineTo(side === "left" ? x1 : x0, y0 + height);
    ctx.stroke();

    ctx.restore();
  }

  function drawShadow(entity, r) {

    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(entity.x, entity.y + r * 0.9, r * 0.95, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer(entity, r, color, accent) {

    drawShadow(entity, r);

    ctx.save();

    const grad = ctx.createRadialGradient(
      entity.x - r * 0.35, entity.y - r * 0.45, r * 0.2,
      entity.x, entity.y, r
    );

    grad.addColorStop(0, accent);
    grad.addColorStop(1, color);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(entity.x, entity.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.stroke();

    // Facing pip
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.beginPath();
    ctx.arc(
      entity.x + entity.face.x * r * 0.52,
      entity.y + entity.face.y * r * 0.52,
      r * 0.24,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
  }

  function drawKeeper(keeper) {

    const color = keeper.team === 0 ? "#2b7fbf" : "#c2485a";
    const accent = keeper.team === 0 ? COLORS.keeperYou : COLORS.keeperCpu;

    drawShadow(keeper, KEEPER_R);

    ctx.save();

    ctx.fillStyle = color;

    const x = keeper.x - KEEPER_R * 0.72;
    const y = keeper.y - KEEPER_R * 1.25;
    const w = KEEPER_R * 1.44;
    const h = KEEPER_R * 2.5;

    ctx.beginPath();

    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 9);
    else ctx.rect(x, y, w, h);

    ctx.fill();

    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(keeper.x, keeper.y - KEEPER_R * 0.5, KEEPER_R * 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBallShape() {

    drawShadow(ball, BALL_R);

    ctx.save();

    ctx.shadowColor = "rgba(255,255,255,.75)";
    ctx.shadowBlur = 18;

    ctx.fillStyle = COLORS.ball;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Simple two-tone panels so the roll reads
    ctx.fillStyle = "rgba(10,20,30,.85)";
    ctx.beginPath();
    ctx.arc(
      ball.x + Math.cos(ball.spin) * BALL_R * 0.35,
      ball.y + Math.sin(ball.spin) * BALL_R * 0.35,
      BALL_R * 0.34,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
  }

  function drawCharge() {

    if (!charging || owner !== 0) return;

    const pct = Math.max(0, Math.min(1, charge));

    ctx.save();

    ctx.strokeStyle = pct > 0.85 ? "#ff5f6d" : (pct > 0.5 ? "#ffe066" : "#26d07c");
    ctx.lineWidth = 4;
    ctx.globalAlpha = 0.9;

    ctx.beginPath();
    ctx.arc(you.x, you.y, PLAYER_R + 9, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  function drawAim() {

    if (owner !== 0) return;

    const len = 54;

    const x = you.x + you.face.x * len;
    const y = you.y + you.face.y * len;

    ctx.save();

    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 8]);

    ctx.beginPath();
    ctx.moveTo(you.x + you.face.x * (PLAYER_R + 4), you.y + you.face.y * (PLAYER_R + 4));
    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.restore();
  }

  function drawScoreboard() {

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "900 44px Inter, Arial, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.14)";

    ctx.fillText(scoreYou + " – " + scoreCpu, CX, PITCH.y0 - 14);

    ctx.restore();
  }

  function drawParticles() {

    particles.forEach(p => {

      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;
  }

  function drawBanner() {

    if (state === "goal") {

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 76px Inter, Arial, sans-serif";
      ctx.fillStyle = lastScorer === 0 ? "rgba(74,168,255,.9)" : "rgba(255,95,109,.9)";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 30;
      ctx.fillText("GOAL!", CX, CY - 120);
      ctx.restore();
    }

    if (state === "kickoff") {

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 42px Inter, Arial, sans-serif";
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.fillText("Kick off", CX, CY - 120);
      ctx.restore();
    }
  }

  function draw() {

    ctx.save();

    if (shake > 0) {
      ctx.translate(
        (Math.random() * 2 - 1) * shake,
        (Math.random() * 2 - 1) * shake
      );
    }

    drawPitch();
    drawScoreboard();

    drawKeeper(keepers[0]);
    drawKeeper(keepers[1]);

    drawPlayer(cpu, PLAYER_R, COLORS.cpu, "#ff9aa4");
    drawPlayer(you, PLAYER_R, COLORS.you, "#9fd0ff");

    drawAim();
    drawBallShape();
    drawCharge();
    drawParticles();
    drawBanner();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }


  /* =========================
     LOOP
  ========================= */

  function advance(ms) {

    accumulator += ms / 1000;

    let guard = 0;

    while (accumulator >= STEP && guard++ < 700) {
      update(STEP);
      accumulator -= STEP;
    }
  }

  function frame(time) {

    if (!lastTime) lastTime = time;

    const delta = Math.min(time - lastTime, 120);

    lastTime = time;

    if (state !== "paused" && state !== "menu" && state !== "fulltime") {
      advance(delta);
    } else {
      stepParticles(delta / 1000);
    }

    draw();

    requestAnimationFrame(frame);
  }


  /* =========================
     UI
  ========================= */

  function formatClock(seconds) {

    const s = Math.max(0, Math.ceil(seconds));

    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  // The HUD is refreshed up to 120 times a second, so only touch the DOM
  // when a value actually changed.
  const uiCache = {};

  function setText(key, el, value) {
    if (uiCache[key] === value) return;
    uiCache[key] = value;
    el.textContent = value;
  }

  function updateUI() {

    setText("you", scoreYouEl, scoreYou);
    setText("cpu", scoreCpuEl, scoreCpu);
    setText("clock", clockEl, formatClock(timeLeft));

    const pct = Math.round(Math.max(0, Math.min(1, charge)) * 100);
    const chargingNow = charging && owner === 0;

    setText("powerLabel", powerLabelEl, chargingNow ? pct + "%" : "Hold to charge");

    const width = pct + "%";

    if (uiCache.power !== width) {
      uiCache.power = width;
      powerBarEl.style.width = width;
    }

    setText(
      "diff",
      diffLabelEl,
      difficulty.charAt(0).toUpperCase() + difficulty.slice(1)
    );
  }

  function showOverlay(title, text, button) {

    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = button;

    ovChoices.style.display = button === "Kick off" ? "flex" : "none";

    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function pause() {

    if (state !== "play" && state !== "kickoff") return;

    state = "paused";

    showOverlay("Paused", "Take a breather — the clock is stopped.", "Resume");
  }

  function resume() {

    if (state !== "paused") return;

    state = "play";

    lastTime = performance.now();
    accumulator = 0;

    hideOverlay();
  }


  /* =========================
     KEYBOARD
  ========================= */

  document.addEventListener("keydown", event => {

    const key = event.key.toLowerCase();

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
      event.preventDefault();
    }

    if (key === "enter") {
      newMatch();
      return;
    }

    if (key === "p" || key === "escape") {
      if (state === "paused") resume();
      else pause();
      return;
    }

    if (key === " ") {
      if (!shootHeld) {
        shootHeld = true;
        if (owner === 0) {
          charging = true;
          charge = 0;
        } else {
          // Quick poke even without clean possession
          const d = Math.hypot(ball.x - you.x, ball.y - you.y);
          if (d < PLAYER_R + BALL_R + 16) {
            const len = Math.hypot(ball.x - you.x, ball.y - you.y) || 1;
            ball.vx = ((ball.x - you.x) / len) * 640;
            ball.vy = ((ball.y - you.y) / len) * 640;
            kickLock = 0.18;
            beep(200, 0.06, "square", 0.045, 150);
          }
        }
      }
      return;
    }

    keys.add(key);
  });

  document.addEventListener("keyup", event => {

    const key = event.key.toLowerCase();

    if (key === " ") {

      shootHeld = false;

      if (owner === 0 && charging) {
        shoot(0, 0.35 + charge * 0.65);
      } else {
        charging = false;
      }

      return;
    }

    keys.delete(key);
  });

  window.addEventListener("blur", () => {
    keys.clear();
    shootHeld = false;
    charging = false;
  });


  /* =========================
     TOUCH: STEER + SHOOT
  ========================= */

  (function bindTouch() {

    const controls = document.getElementById("controls");

    controls.addEventListener("pointerdown", event => {

      const button = event.target.closest("button");

      if (!button) return;

      event.preventDefault();

      const act = button.dataset.act;

      if (act === "shoot") {
        if (owner === 0) {
          charging = true;
          charge = 0;
        }
        return;
      }

      if (act === "pause") {
        if (state === "paused") resume();
        else pause();
        return;
      }

      stick[act] = true;
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(type => {

      controls.addEventListener(type, event => {

        const button = event.target.closest("button");

        if (!button) return;

        const act = button.dataset.act;

        if (act === "shoot") {
          if (owner === 0 && charging) shoot(0, 0.35 + charge * 0.65);
          else charging = false;
          return;
        }

        if (act !== "pause") stick[act] = false;
      });
    });

    // Drag anywhere on the pitch to steer toward that point
    let dragging = false;

    function steerFrom(event) {

      const rect = canvas.getBoundingClientRect();

      const x = (event.clientX - rect.left - view.ox) / view.scale;
      const y = (event.clientY - rect.top - view.oy) / view.scale;

      const dx = x - you.x;
      const dy = y - you.y;

      const dist = Math.hypot(dx, dy);

      if (dist < 18) {
        stick.up = stick.down = stick.left = stick.right = false;
        return;
      }

      const nx = dx / dist;
      const ny = dy / dist;

      stick.right = nx > 0.35;
      stick.left = nx < -0.35;
      stick.down = ny > 0.35;
      stick.up = ny < -0.35;
    }

    fieldEl.addEventListener("pointerdown", event => {
      if (state !== "play" && state !== "kickoff") return;
      dragging = true;
      steerFrom(event);
    });

    fieldEl.addEventListener("pointermove", event => {
      if (!dragging) return;
      steerFrom(event);
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
      fieldEl.addEventListener(type, () => {
        dragging = false;
        stick.up = stick.down = stick.left = stick.right = false;
      });
    });
  })();


  /* =========================
     OVERLAY BUTTONS
  ========================= */

  ovChoices.addEventListener("click", event => {

    const button = event.target.closest("button[data-diff]");

    if (!button) return;

    difficulty = button.dataset.diff;

    ovChoices.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    updateUI();
  });

  ovBtn.addEventListener("click", () => {

    if (state === "paused") {
      resume();
      return;
    }

    newMatch();
    beep(620, 0.1, "square", 0.05);
  });

  muteEl.addEventListener("click", () => {
    muted = !muted;
    saveMuted(muted);
    updateMuteButton();
  });


  /* =========================
     EVENTS + START
  ========================= */

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 250));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause();
    else lastTime = performance.now();
  });

  if (
    ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
    window.matchMedia("(pointer: coarse)").matches
  ) {
    document.body.classList.add("touch");
  }

  layout();
  updateMuteButton();
  resetPositions(0);
  updateUI();

  // Wait on the menu until kick off
  state = "menu";
  celebration = 0.9;

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layout).catch(() => {});
  }

  requestAnimationFrame(frame);


  /* =========================
     TEST HOOKS
  ========================= */

  window.gameAPI = {
    get state() { return state; },
    get scoreYou() { return scoreYou; },
    get scoreCpu() { return scoreCpu; },
    get timeLeft() { return timeLeft; },
    set timeLeft(v) { timeLeft = v; },
    get charge() { return charge; },
    get owner() { return owner; },
    get ball() { return ball; },
    get you() { return you; },
    get cpu() { return cpu; },
    get keepers() { return keepers; },
    set difficulty(v) { difficulty = v; updateUI(); },
    get difficulty() { return difficulty; },
    step(ms) { advance(ms); },
    start() { newMatch(); },
    pause,
    resume,
    kick(power) { if (owner === 0) shoot(0, power == null ? 1 : power); },
    PITCH,
    CONST: { W, H, CY, MOUTH, GOAL_DEPTH }
  };

})();

</script>

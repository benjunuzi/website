<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Adding a subtle animation for feedback messages */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <main class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 max-w-md w-full border border-slate-100">
        <div class="text-center mb-6 sm:mb-8">
            <div class="text-5xl mb-4">🎮</div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Number Guessing Game</h1>
            <p class="text-sm sm:text-base text-slate-500">I'm thinking of a number between 1 and 100.</p>
        </div>

        <div class="space-y-4">
            <!-- Input Area -->
            <div>
                <label for="guessInput" class="sr-only">Enter your guess</label>
                <input 
                    type="number" 
                    id="guessInput" 
                    min="1" 
                    max="100" 
                    inputmode="numeric"
                    pattern="[0-9]*"
                    class="w-full text-center text-3xl p-4 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all placeholder:text-slate-300"
                    placeholder="00"
                >
            </div>
            
            <button 
                id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-colors active:scale-[0.98]"
            >
                Submit Guess
            </button>
        </div>

        <!-- Feedback & Stats Area -->
        <div class="mt-8 text-center min-h-[100px] flex flex-col items-center justify-center">
            <p id="messageDisplay" class="text-xl font-semibold mb-2"></p>
            <p id="attemptsDisplay" class="text-sm text-slate-400 hidden">Attempts: <span id="attemptsCount" class="font-bold text-slate-600">0</span></p>
            
            <button 
                id="restartBtn"
                class="mt-4 hidden bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-semibold py-2 px-6 rounded-lg transition-colors"
            >
                Play Again 🔄
            </button>
        </div>

        <!-- Leaderboard Area -->
        <div class="mt-8 border-t border-slate-100 pt-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center justify-center gap-2">
                🏆 Top Scores
            </h2>
            <ul id="leaderboardList" class="space-y-2 text-sm text-slate-600">
                <li class="text-center italic text-slate-400">No scores yet! Win a game to get on the board.</li>
            </ul>
        </div>
    </main>

    <script>
        // Game variables (just like the Python version!)
        let secretNumber;
        let attempts;
        let gameActive = true;
        let leaderboard = [];

        // DOM Elements
        const guessInput = document.getElementById('guessInput');
        const submitBtn = document.getElementById('submitBtn');
        const messageDisplay = document.getElementById('messageDisplay');
        const attemptsDisplay = document.getElementById('attemptsDisplay');
        const attemptsCount = document.getElementById('attemptsCount');
        const restartBtn = document.getElementById('restartBtn');

        // Initialize the game
        function initGame() {
            // random.randint(1, 100) equivalent in JS
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            gameActive = true;
            
            // Reset UI
            guessInput.value = '';
            guessInput.disabled = false;
            submitBtn.disabled = false;
            messageDisplay.textContent = '';
            messageDisplay.className = 'text-xl font-semibold mb-2';
            attemptsDisplay.classList.add('hidden');
            attemptsCount.textContent = '0';
            restartBtn.classList.add('hidden');
            
            // Focus input automatically
            guessInput.focus();
        }

        // Handle the guess logic
        function handleGuess() {
            if (!gameActive) return;

            const guessValue = guessInput.value;
            const guess = parseInt(guessValue, 10);

            // "except ValueError:" equivalent (checking for invalid input)
            if (isNaN(guess) || guessValue.trim() === "") {
                showMessage("Oops! Please enter a valid number.", "text-amber-600");
                return;
            }

            attempts++;
            attemptsCount.textContent = attempts;
            attemptsDisplay.classList.remove('hidden');

            // Reset animation by triggering reflow
            messageDisplay.classList.remove('animate-pop');
            void messageDisplay.offsetWidth;
            messageDisplay.classList.add('animate-pop');

            // The core game logic
            if (guess < secretNumber) {
                showMessage("Too low! Try again. ⬆️", "text-blue-600");
                guessInput.value = '';
                guessInput.focus();
            } else if (guess > secretNumber) {
                showMessage("Too high! Try again. ⬇️", "text-orange-500");
                guessInput.value = '';
                guessInput.focus();
            } else {
                showMessage(`🎉 You got it! The number was ${secretNumber}.`, "text-emerald-600");
                endGame();
            }
        }

        // Helper function to show messages with colors
        function showMessage(text, colorClass) {
            messageDisplay.textContent = text;
            messageDisplay.className = `text-xl font-semibold mb-2 ${colorClass} animate-pop`;
        }

        // Handle game over state
        function endGame() {
            gameActive = false;
            guessInput.disabled = true;
            submitBtn.disabled = true;
            restartBtn.classList.remove('hidden');
            guessInput.blur(); // Hides the mobile keyboard on win!

            // Update Leaderboard
            leaderboard.push(attempts);
            leaderboard.sort((a, b) => a - b); // Lowest attempts first
            leaderboard = leaderboard.slice(0, 5); // Keep top 5
            updateLeaderboardUI();
        }

        function updateLeaderboardUI() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            
            leaderboard.forEach((score, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100';
                
                let medal = '🏅';
                if (index === 0) medal = '🥇';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';

                li.innerHTML = `
                    <span class="font-bold text-slate-700 flex items-center gap-2">${medal} Rank ${index + 1}</span> 
                    <span><span class="font-bold text-blue-600 text-lg">${score}</span> attempts</span>
                `;
                list.appendChild(li);
            });
        }

        // Event Listeners
        submitBtn.addEventListener('click', handleGuess);

        // Allow hitting "Enter" to submit
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });

        restartBtn.addEventListener('click', initGame);

        // Start the game when the page loads
        initGame();
    </script>
</body>
</html>

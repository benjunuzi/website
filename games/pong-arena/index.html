<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>Pong Arena 🏓 · ben.junuzi.com</title>
<link rel="icon" href="../../logo-mark.svg">
<link rel="apple-touch-icon" href="../../logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #04060d;
    --panel: rgba(255,255,255,.045);
    --line: rgba(255,255,255,.10);
    --text: #e9eef9;
    --muted: #93a0c4;
    --accent: #2f7bff;
    --accent2: #4aa8ff;
    --p1: #4aa8ff;
    --p2: #ff5f8d;
    --ball: #ffe066;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 78% -10%, rgba(47,120,255,.22), transparent 62%),
      radial-gradient(760px 480px at -6% 28%, rgba(255,60,120,.14), transparent 62%),
      radial-gradient(700px 460px at 60% 112%, rgba(0,180,219,.12), transparent 62%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent); color: #04060d; }

  .app {
    margin: auto;
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px 7px 9px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: border-color .18s ease, transform .18s ease;
  }
  .brand:hover { border-color: rgba(79,140,255,.65); transform: translateY(-1px); }
  .brand img { width: 22px; height: 22px; display: block; }

  .title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- stage ---------- */
  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 14px;
    width: 100%;
  }

  .field {
    position: relative;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.11);
    background: rgba(6,10,22,.94);
    box-shadow:
      0 22px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(47,120,255,.12),
      0 0 70px rgba(47,120,255,.10);
    overflow: hidden;
    touch-action: none;
    cursor: none;
  }
  .field canvas { display: block; width: 100%; height: 100%; }

  /* ---------- hud ---------- */
  .hud {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 176px;
    flex: 0 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 11px 10px;
    backdrop-filter: blur(8px);
    min-width: 0;
  }

  .k {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .v {
    margin-top: 2px;
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .v.small { font-size: 15px; }

  .side-score {
    display: flex;
    gap: 8px;
  }
  .side-score .panel { flex: 1 1 0; text-align: center; }
  .side-score .you .v { color: var(--p1); }
  .side-score .cpu .v { color: var(--p2); }

  .keys {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    padding: 0 2px;
  }
  .keys b { color: #dbe6ff; font-weight: 700; }

  /* ---------- overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    padding: 18px;
    background: linear-gradient(180deg, rgba(4,6,13,.72), rgba(4,6,13,.9));
    backdrop-filter: blur(4px);
    text-align: center;
  }
  .overlay.show { display: grid; }
  .overlay h2 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4.6vw, 34px);
    font-weight: 900;
    letter-spacing: .01em;
  }
  .overlay p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.55; }

  .btn {
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    padding: 11px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2b6bff, #3fa2ff);
    box-shadow: 0 10px 26px rgba(48,120,255,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  .btn.ghost {
    background: rgba(255,255,255,.06);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost.active {
    border-color: rgba(79,140,255,.75);
    background: rgba(47,120,255,.22);
  }

  .controls {
    display: none;
    width: 100%;
    max-width: 460px;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    touch-action: none;
  }
  .controls button {
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 0;
    min-height: 48px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .controls button:active { transform: scale(.96); border-color: rgba(79,140,255,.7); }

  body.touch .controls { display: grid; }
  body.touch .keys { display: none; }

  .credit {
    font-size: 11px;
    color: #6f7ea3;
    text-align: center;
  }
  .credit a { color: #9fb6e8; text-decoration: none; border-bottom: 1px solid rgba(159,182,232,.35); }
  .credit a:hover { color: #cfe1ff; }

  .mute {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .mute:hover { border-color: rgba(79,140,255,.65); }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .stage { flex-direction: column; align-items: center; gap: 12px; }
    .hud { width: 100%; max-width: 520px; flex-direction: row; flex-wrap: wrap; }
    .hud .side-score { flex: 1 1 150px; }
    .hud .panel.grow { flex: 1 1 150px; }
    .k { font-size: 8px; letter-spacing: .1em; }
    .v { font-size: 17px; }
    .title { display: none; }
    .field { cursor: default; }
  }
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <a class="brand" href="../../index.html">
      <img src="../../logo-mark.svg" alt="">
      ben.junuzi.com
    </a>
    <div class="title">🏓 Pong Arena</div>
    <button class="mute" id="mute" title="Toggle sound">🔊</button>
  </header>

  <main class="stage">

    <div class="field" id="field">
      <canvas id="court"></canvas>

      <div class="overlay show" id="overlay">
        <div>
          <h2 id="ovTitle">Pong Arena</h2>
          <p id="ovText">First to 7 takes the match. Move with the mouse, your finger, or ↑ ↓.</p>
          <div class="btn-row" id="ovChoices">
            <button class="btn ghost" data-diff="easy">Easy</button>
            <button class="btn ghost active" data-diff="normal">Normal</button>
            <button class="btn ghost" data-diff="hard">Hard</button>
          </div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn" id="ovBtn">Play</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="hud">
      <div class="side-score">
        <div class="panel you">
          <div class="k">You</div>
          <div class="v" id="scoreP1">0</div>
        </div>
        <div class="panel cpu">
          <div class="k">CPU</div>
          <div class="v" id="scoreP2">0</div>
        </div>
      </div>

      <div class="panel grow">
        <div class="k">Rally</div>
        <div class="v" id="rally">0</div>
      </div>

      <div class="panel grow">
        <div class="k">Best rally</div>
        <div class="v" id="best">0</div>
      </div>

      <div class="panel grow">
        <div class="k">Difficulty</div>
        <div class="v small" id="diffLabel">Normal</div>
      </div>

      <div class="keys">
        <span><b>Mouse</b> move</span>
        <span><b>↑ ↓ / W S</b> move</span>
        <span><b>P</b> pause</span>
        <span><b>Enter</b> rematch</span>
      </div>
    </aside>

  </main>

  <div class="controls" id="controls">
    <button data-act="pause">Pause</button>
    <button data-act="restart">Restart</button>
    <button data-act="diff">Difficulty</button>
  </div>

  <div class="credit">
    Part of <a href="../../index.html">ben.junuzi.com</a> · 🏓 Pong Arena
  </div>

</div>

<script>
"use strict";

(function () {

  /* =========================
     CONSTANTS
  ========================= */

  const W = 960;   // logical field width
  const H = 600;   // logical field height

  const PADDLE_W = 16;
  const PADDLE_H = 108;
  const PADDLE_INSET = 42;

  const BALL_R = 11;
  const BALL_START_SPEED = 430;
  const BALL_MAX_SPEED = 1180;
  const BALL_SPEEDUP = 20;

  // A rally longer than this is basically a stalemate — nudge the ball faster.
  const RALLY_HEATUP = 8;

  const AI = {
    easy:   { speed: 330, reaction: 260, error: 62, idle: 0.10, panic: 1.1 },
    normal: { speed: 450, reaction: 170, error: 34, idle: 0.16, panic: 1.5 },
    hard:   { speed: 640, reaction: 110, error: 14, idle: 0.22, panic: 0.7 }
  };

  const WIN_SCORE = 7;

  // Must match .app { max-width } in the stylesheet
  const APP_MAX = 980;

  const COLORS = {
    p1: "#4aa8ff",
    p2: "#ff5f8d",
    ball: "#ffe066"
  };


  /* =========================
     DOM
  ========================= */

  const fieldEl = document.getElementById("field");
  const canvas = document.getElementById("court");
  const ctx = canvas.getContext("2d");

  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovBtn = document.getElementById("ovBtn");
  const ovChoices = document.getElementById("ovChoices");

  const scoreP1El = document.getElementById("scoreP1");
  const scoreP2El = document.getElementById("scoreP2");
  const rallyEl = document.getElementById("rally");
  const bestEl = document.getElementById("best");
  const diffLabelEl = document.getElementById("diffLabel");
  const muteEl = document.getElementById("mute");


  /* =========================
     SOUND
  ========================= */

  let audioCtx = null;
  let muted = loadMuted();

  function loadMuted() {
    try { return localStorage.getItem("pong.muted") === "1"; } catch (err) { return false; }
  }

  function saveMuted(value) {
    try { localStorage.setItem("pong.muted", value ? "1" : "0"); } catch (err) {}
  }

  function beep(freq, duration, type = "square", gain = 0.05) {

    if (muted) return;

    try {

      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }

      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      amp.gain.setValueAtTime(gain, audioCtx.currentTime);
      amp.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      osc.connect(amp);
      amp.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);

    } catch (err) {
      /* audio is a nicety — never let it break the game */
    }
  }

  function updateMuteButton() {
    muteEl.textContent = muted ? "🔇" : "🔊";
  }


  /* =========================
     STATE
  ========================= */

  let state = "menu";           // menu | serve | play | paused | over

  let difficulty = "normal";

  let scoreP1 = 0;
  let scoreP2 = 0;

  let rally = 0;
  let bestRally = loadBest();

  let serveTimer = 0;
  let serveDir = 1;
  let winner = null;

  let shake = 0;
  let particles = [];

  const ball = {
    x: W / 2,
    y: H / 2,
    vx: 0,
    vy: 0,
    trail: []
  };

  const paddles = [
    { x: PADDLE_INSET, y: H / 2, target: H / 2, vy: 0, vyKey: 0 },
    { x: W - PADDLE_INSET - PADDLE_W, y: H / 2, target: H / 2, vy: 0, vyKey: 0 }
  ];

  let view = { scale: 1, ox: 0, oy: 0 };

  let aiTarget = H / 2;
  let aiClock = 0;


  /* =========================
     BEST RALLY
  ========================= */

  function loadBest() {
    try { return parseInt(localStorage.getItem("pong.best") || "0", 10) || 0; } catch (err) { return 0; }
  }

  function saveBest(value) {
    try { localStorage.setItem("pong.best", String(value)); } catch (err) {}
  }


  /* =========================
     LAYOUT
  ========================= */

  function layout() {

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const compact = vw <= 760;

    const hudW = compact ? 0 : 176;
    const gap = compact ? 0 : 14;

    const topbar = document.querySelector(".topbar");
    const credit = document.querySelector(".credit");
    const controls = document.getElementById("controls");

    const controlsVisible = getComputedStyle(controls).display !== "none";

    const chrome =
      topbar.offsetHeight +
      credit.offsetHeight +
      (controlsVisible ? controls.offsetHeight : 0) +
      (compact ? 118 : 34) +
      32;

    const availW = Math.min(vw - 32, APP_MAX) - hudW - gap;
    const availH = vh - chrome;

    let w = Math.min(availW, availH * (W / H));

    w = Math.max(compact ? 300 : 360, Math.min(w, 960));

    const h = w * (H / W);

    fieldEl.style.width = Math.round(w) + "px";
    fieldEl.style.height = Math.round(h) + "px";

    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    const scale = Math.min(w / W, h / H);

    view = {
      scale,
      ox: (w - W * scale) / 2,
      oy: (h - H * scale) / 2
    };

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * view.ox, dpr * view.oy);
  }


  /* =========================
     GAME FLOW
  ========================= */

  function resetBall(direction) {

    ball.x = W / 2;
    ball.y = H / 2 + (Math.random() * 120 - 60);
    ball.vx = 0;
    ball.vy = 0;
    ball.trail.length = 0;

    serveDir = direction;
    serveTimer = 0.9;

    state = "serve";
  }

  function launchBall() {

    const angle = (Math.random() * 0.5 - 0.25);   // small random tilt

    ball.vx = Math.cos(angle) * BALL_START_SPEED * serveDir;
    ball.vy = Math.sin(angle) * BALL_START_SPEED;

    state = "play";
  }

  function newMatch(keepDifficulty) {

    scoreP1 = 0;
    scoreP2 = 0;
    rally = 0;
    winner = null;
    particles = [];

    paddles[0].y = H / 2;
    paddles[0].target = H / 2;
    paddles[1].y = H / 2;
    paddles[1].target = H / 2;

    if (!keepDifficulty) {
      // difficulty stays as chosen
    }

    resetBall(Math.random() < 0.5 ? -1 : 1);

    hideOverlay();
    updateUI();
  }

  function point(who) {

    if (who === 1) {
      scoreP1++;
      burst(W - 60, ball.y, COLORS.p1);
      beep(180, 0.22, "sawtooth", 0.06);
      serveDir = -1;
    } else {
      scoreP2++;
      burst(60, ball.y, COLORS.p2);
      beep(120, 0.28, "sawtooth", 0.06);
      serveDir = 1;
    }

    if (rally > bestRally) {
      bestRally = rally;
      saveBest(bestRally);
    }

    rally = 0;
    shake = 10;

    updateUI();

    if (scoreP1 >= WIN_SCORE || scoreP2 >= WIN_SCORE) {
      endMatch();
      return;
    }

    resetBall(serveDir);
  }

  function endMatch() {

    state = "over";

    winner = scoreP1 > scoreP2 ? 1 : 2;

    showOverlay(
      winner === 1 ? "You win! 🏆" : "CPU wins 🤖",
      scoreP1 + " – " + scoreP2 + " · best rally " + bestRally,
      "Rematch"
    );
  }


  /* =========================
     PHYSICS
  ========================= */

  function serveBall(dt) {

    serveTimer -= dt;

    if (serveTimer <= 0) launchBall();
  }

  function movePaddles(dt) {

    const speed = 900;

    // Player paddle — keyboard or pointer target
    const player = paddles[0];

    if (player.vyKey !== 0) {
      player.target = player.y + player.vyKey * 90;
    }

    const diff = player.target - player.y;
    const step = Math.max(-speed * dt, Math.min(speed * dt, diff));

    player.y += step;
    player.vy = step / dt;

    player.y = Math.max(PADDLE_H / 2, Math.min(H - PADDLE_H / 2, player.y));

    // CPU paddle
    const cpu = paddles[1];
    const cfg = AI[difficulty];

    aiClock -= dt;

    if (aiClock <= 0) {

      aiClock = cfg.reaction / 1000;

      if (ball.vx > 0) {
        // A faster ball is genuinely harder to read, so the CPU's aim error
        // grows as the rally heats up — otherwise rallies never end.
        const heat = Math.min(1, Math.hypot(ball.vx, ball.vy) / BALL_MAX_SPEED);
        const error = cfg.error * (1 + heat * cfg.panic);

        aiTarget = predictY(cpu.x - BALL_R) + (Math.random() * 2 - 1) * error;
      } else {
        aiTarget = H / 2 + (ball.y - H / 2) * cfg.idle +
          (Math.random() * 2 - 1) * cfg.error * 0.6;
      }
    }

    const cpuDiff = aiTarget - cpu.y;
    const cpuStep = Math.max(-cfg.speed * dt, Math.min(cfg.speed * dt, cpuDiff));

    cpu.y += cpuStep;
    cpu.vy = cpuStep / dt;

    cpu.y = Math.max(PADDLE_H / 2, Math.min(H - PADDLE_H / 2, cpu.y));
  }

  function predictY(targetX) {

    if (Math.abs(ball.vx) < 1) return ball.y;

    const t = (targetX - ball.x) / ball.vx;

    if (t < 0) return ball.y;

    const span = H - 2 * BALL_R;
    const period = 2 * span;

    let k = ((ball.y - BALL_R) + ball.vy * t) % period;

    if (k < 0) k += period;

    return k < span
      ? BALL_R + k
      : BALL_R + (period - k);
  }

  function clampBallSpeed() {

    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed === 0) return;

    // Never let the ball get too vertical — it makes for boring rallies.
    const maxVy = speed * 0.88;

    if (Math.abs(ball.vy) > maxVy) {
      ball.vy = Math.sign(ball.vy) * maxVy;
      ball.vx = Math.sign(ball.vx) * Math.sqrt(Math.max(0, speed * speed - ball.vy * ball.vy));
    }
  }

  function paddleHit(index) {

    const paddle = paddles[index];

    const relative = (ball.y - paddle.y) / (PADDLE_H / 2);
    const offset = Math.max(-1, Math.min(1, relative));

    let speed = Math.hypot(ball.vx, ball.vy) + BALL_SPEEDUP;

    if (rally >= RALLY_HEATUP) speed += 12;

    speed = Math.min(speed, BALL_MAX_SPEED);

    // Bounce angle up to ~58 degrees off the horizontal
    const angle = offset * (58 * Math.PI / 180);

    // Spin: the paddle's own movement drags the ball with it
    const spin = Math.max(-0.35, Math.min(0.35, paddle.vy / 1400));

    const dir = index === 0 ? 1 : -1;

    ball.vx = Math.cos(angle) * speed * dir;
    ball.vy = Math.sin(angle + spin) * speed;

    ball.x = index === 0
      ? paddle.x + PADDLE_W + BALL_R + 1
      : paddle.x - BALL_R - 1;

    clampBallSpeed();

    rally++;

    if (rally > bestRally) {
      bestRally = rally;
      saveBest(bestRally);
    }

    shake = Math.min(7, 2 + Math.abs(offset) * 4);

    beep(320 + rally * 18, 0.06, "square", 0.045);

    updateUI();
  }

  function stepBall(dt) {

    // Sub-step so a fast ball can never tunnel through a paddle
    const maxStep = BALL_R * 0.6;
    const distance = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(distance / maxStep));

    const sdt = dt / steps;

    for (let i = 0; i < steps; i++) {

      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      // Top / bottom
      if (ball.y - BALL_R < 0) {
        ball.y = BALL_R;
        ball.vy = Math.abs(ball.vy);
        shake = Math.max(shake, 3);
        beep(520, 0.04, "triangle", 0.03);
      } else if (ball.y + BALL_R > H) {
        ball.y = H - BALL_R;
        ball.vy = -Math.abs(ball.vy);
        shake = Math.max(shake, 3);
        beep(520, 0.04, "triangle", 0.03);
      }

      // Paddles — only collide while moving toward them
      for (let p = 0; p < 2; p++) {

        const paddle = paddles[p];

        const toward = p === 0 ? ball.vx < 0 : ball.vx > 0;

        if (!toward) continue;

        const px = paddle.x;
        const py = paddle.y - PADDLE_H / 2;

        const closestX = Math.max(px, Math.min(ball.x, px + PADDLE_W));
        const closestY = Math.max(py, Math.min(ball.y, py + PADDLE_H));

        const dx = ball.x - closestX;
        const dy = ball.y - closestY;

        if (dx * dx + dy * dy <= BALL_R * BALL_R) {
          paddleHit(p);
          return;
        }
      }

      // Scoring
      if (ball.x + BALL_R < -20) { point(2); return; }
      if (ball.x - BALL_R > W + 20) { point(1); return; }
    }
  }

  function stepParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

      const p = particles[i];

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.life -= dt;

      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function burst(x, y, color) {

    for (let i = 0; i < 22; i++) {

      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 320;

      particles.push({
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.5,
        color
      });
    }
  }


  /* =========================
     UPDATE
  ========================= */

  function update(dt) {

    if (state === "serve") {
      movePaddles(dt);
      serveBall(dt);
    } else if (state === "play") {
      movePaddles(dt);
      stepBall(dt);
    }

    stepParticles(dt);

    if (shake > 0) shake = Math.max(0, shake - dt * 40);

    // Ball trail
    if (state === "play" || state === "serve") {

      ball.trail.push({ x: ball.x, y: ball.y });

      const maxTrail = 16;

      while (ball.trail.length > maxTrail) ball.trail.shift();
    }
  }


  /* =========================
     DRAWING
  ========================= */

  function drawCourt() {

    ctx.fillStyle = "rgba(6,10,22,.96)";
    ctx.fillRect(0, 0, W, H);

    // Soft vignette glow
    const glow = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.62);
    glow.addColorStop(0, "rgba(47,120,255,.10)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Centre line
    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.lineWidth = 3;
    ctx.setLineDash([14, 18]);

    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();

    ctx.setLineDash([]);

    // Centre circle
    ctx.strokeStyle = "rgba(255,255,255,.09)";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 86, 0, Math.PI * 2);
    ctx.stroke();

    // Border
    ctx.strokeStyle = "rgba(255,255,255,.07)";
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
  }

  function drawScore() {

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "900 120px Inter, Arial, sans-serif";

    ctx.fillStyle = "rgba(74,168,255,.16)";
    ctx.fillText(String(scoreP1), W / 2 - 120, 108);

    ctx.fillStyle = "rgba(255,95,141,.16)";
    ctx.fillText(String(scoreP2), W / 2 + 120, 108);

    ctx.restore();
  }

  function drawPaddle(paddle, color) {

    ctx.save();

    ctx.shadowColor = color;
    ctx.shadowBlur = 26;
    ctx.fillStyle = color;

    const r = 8;
    const x = paddle.x;
    const y = paddle.y - PADDLE_H / 2;

    ctx.beginPath();

    if (ctx.roundRect) {
      ctx.roundRect(x, y, PADDLE_W, PADDLE_H, r);
    } else {
      ctx.rect(x, y, PADDLE_W, PADDLE_H);
    }

    ctx.fill();

    ctx.restore();
  }

  function drawBall() {

    // Trail
    ball.trail.forEach((p, i) => {

      const t = i / ball.trail.length;

      ctx.globalAlpha = t * 0.32;
      ctx.fillStyle = COLORS.ball;

      ctx.beginPath();
      ctx.arc(p.x, p.y, BALL_R * (0.35 + t * 0.6), 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;

    ctx.save();

    ctx.shadowColor = COLORS.ball;
    ctx.shadowBlur = 26;
    ctx.fillStyle = COLORS.ball;

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles() {

    particles.forEach(p => {

      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.color;

      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;
  }

  function drawServeHint() {

    if (state !== "serve") return;

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#dfe8ff";
    ctx.font = "700 26px Inter, Arial, sans-serif";
    ctx.textAlign = "center";

    ctx.fillText(
      Math.ceil(serveTimer * 10) / 10 + "s",
      W / 2,
      H - 70
    );

    ctx.restore();
  }

  function draw() {

    ctx.save();

    if (shake > 0) {
      ctx.translate(
        (Math.random() * 2 - 1) * shake,
        (Math.random() * 2 - 1) * shake
      );
    }

    drawCourt();
    drawScore();
    drawParticles();

    drawPaddle(paddles[0], COLORS.p1);
    drawPaddle(paddles[1], COLORS.p2);

    if (state !== "over") drawBall();

    drawServeHint();

    ctx.restore();
  }


  /* =========================
     LOOP (fixed timestep)
  ========================= */

  const STEP = 1 / 120;

  let accumulator = 0;
  let lastTime = 0;

  function advance(ms) {

    accumulator += ms / 1000;

    let guard = 0;

    while (accumulator >= STEP && guard++ < 600) {
      update(STEP);
      accumulator -= STEP;
    }
  }

  function frame(time) {

    if (!lastTime) lastTime = time;

    const delta = Math.min(time - lastTime, 120);

    lastTime = time;

    if (state !== "paused" && state !== "menu") {
      advance(delta);
    } else {
      stepParticles(delta / 1000);
    }

    draw();

    requestAnimationFrame(frame);
  }


  /* =========================
     UI
  ========================= */

  function updateUI() {

    scoreP1El.textContent = scoreP1;
    scoreP2El.textContent = scoreP2;
    rallyEl.textContent = rally;
    bestEl.textContent = bestRally;
    diffLabelEl.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
  }

  function showOverlay(title, text, button) {

    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = button;

    ovChoices.style.display = button === "Play" ? "flex" : "none";

    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function pause() {

    if (state !== "play" && state !== "serve") return;

    state = "paused";

    showOverlay("Paused", "The ball is hanging in mid-air.", "Resume");
  }

  function resume() {

    if (state !== "paused") return;

    state = ball.vx === 0 && ball.vy === 0 ? "serve" : "play";

    lastTime = performance.now();
    accumulator = 0;

    hideOverlay();
  }


  /* =========================
     INPUT — POINTER
  ========================= */

  function pointerToField(event) {

    const rect = canvas.getBoundingClientRect();

    return {
      x: (event.clientX - rect.left - view.ox) / view.scale,
      y: (event.clientY - rect.top - view.oy) / view.scale
    };
  }

  fieldEl.addEventListener("pointermove", event => {

    if (state !== "play" && state !== "serve") return;

    const p = pointerToField(event);

    paddles[0].target = Math.max(
      PADDLE_H / 2,
      Math.min(H - PADDLE_H / 2, p.y)
    );
  });

  fieldEl.addEventListener("pointerdown", event => {

    if (state === "play" || state === "serve") {
      const p = pointerToField(event);
      paddles[0].target = Math.max(PADDLE_H / 2, Math.min(H - PADDLE_H / 2, p.y));
    }
  });


  /* =========================
     INPUT — KEYBOARD
  ========================= */

  const pressed = new Set();

  function syncKeyDirection() {

    let dir = 0;

    if (pressed.has("arrowup") || pressed.has("w")) dir -= 1;
    if (pressed.has("arrowdown") || pressed.has("s")) dir += 1;

    paddles[0].vyKey = dir;
  }

  document.addEventListener("keydown", event => {

    const key = event.key.toLowerCase();

    if (["arrowup", "arrowdown", " "].includes(key)) event.preventDefault();

    if (key === "enter") {
      newMatch(true);
      return;
    }

    if (key === "p" || key === "escape") {

      if (state === "play" || state === "serve") pause();
      else if (state === "paused") resume();

      return;
    }

    if (pressed.has(key)) return;

    pressed.add(key);
    syncKeyDirection();
  });

  document.addEventListener("keyup", event => {

    pressed.delete(event.key.toLowerCase());
    syncKeyDirection();
  });

  window.addEventListener("blur", () => {
    pressed.clear();
    syncKeyDirection();
  });


  /* =========================
     OVERLAY + TOUCH BUTTONS
  ========================= */

  ovChoices.addEventListener("click", event => {

    const button = event.target.closest("button[data-diff]");

    if (!button) return;

    difficulty = button.dataset.diff;

    ovChoices.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    updateUI();
  });

  ovBtn.addEventListener("click", () => {

    if (state === "paused") {
      resume();
    } else {
      newMatch(true);
      beep(660, 0.08, "square", 0.05);
    }
  });

  (function bindControls() {

    const controls = document.getElementById("controls");

    controls.addEventListener("click", event => {

      const button = event.target.closest("button");

      if (!button) return;

      const act = button.dataset.act;

      if (act === "pause") {
        if (state === "paused") resume();
        else pause();
      }

      if (act === "restart") newMatch(true);

      if (act === "diff") {
        const order = ["easy", "normal", "hard"];
        difficulty = order[(order.indexOf(difficulty) + 1) % order.length];
        updateUI();
      }
    });
  })();

  muteEl.addEventListener("click", () => {
    muted = !muted;
    saveMuted(muted);
    updateMuteButton();
  });


  /* =========================
     WINDOW EVENTS
  ========================= */

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 250));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause();
    else lastTime = performance.now();
  });


  /* =========================
     START
  ========================= */

  if (
    ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
    window.matchMedia("(pointer: coarse)").matches
  ) {
    document.body.classList.add("touch");
  }

  layout();
  updateMuteButton();
  updateUI();
  resetBall(Math.random() < 0.5 ? -1 : 1);

  // Stay on the menu screen until the player hits Play
  state = "menu";
  ball.trail.length = 0;

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layout).catch(() => {});
  }

  requestAnimationFrame(frame);


  /* =========================
     TEST HOOKS
  ========================= */

  window.gameAPI = {
    get state() { return state; },
    get scoreP1() { return scoreP1; },
    get scoreP2() { return scoreP2; },
    get rally() { return rally; },
    get bestRally() { return bestRally; },
    get difficulty() { return difficulty; },
    get ball() { return ball; },
    get paddles() { return paddles; },
    set difficulty(v) { difficulty = v; updateUI(); },
    step(ms) { advance(ms); },
    start() { newMatch(true); },
    pause,
    resume,
    FIELD: { W, H, PADDLE_H, BALL_R, PADDLE_INSET, PADDLE_W }
  };

})();

</script>

</body>
</html>

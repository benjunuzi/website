<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Star Scoop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: auto; font-family: system-ui, sans-serif; background: radial-gradient(circle at 50% -20%, #3a1b6f, #0c1028 55%, #050614); color: #fff; }
    .game { width: min(92vw, 430px); text-align: center; }
    h1 { margin: 0; font-size: clamp(2.2rem, 9vw, 3.6rem); letter-spacing: .05em; color: #ffd75f; text-shadow: 0 4px #8e3b70; }
    .tagline { margin: .15rem 0 .9rem; color: #c6c8ed; }
    .hud { display: flex; justify-content: space-between; padding: .7rem 1rem; border-radius: 15px 15px 0 0; background: #1e2452; font-weight: 800; }
    #field { position: relative; height: clamp(270px, 56vh, 500px); overflow: hidden; border: 4px solid #5964bc; border-radius: 0 0 22px 22px; background: linear-gradient(#121845 0%, #171a54 75%, #25226d); box-shadow: 0 18px 50px #0008; touch-action: none; }
    .spark { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: white; opacity: .65; }
    .star { position: absolute; font-size: 2.25rem; line-height: 1; filter: drop-shadow(0 0 8px #ffe36e); user-select: none; transform: translate(-50%, -50%); }
    #ship { position: absolute; bottom: 18px; left: 50%; font-size: 3.25rem; line-height: 1; transform: translateX(-50%); filter: drop-shadow(0 4px 3px #050614); user-select: none; will-change: left, transform; }
    .tip { min-height: 2.4rem; margin: .85rem 0; color: #d9dafa; font-size: .95rem; }
    button { border: 0; border-radius: 999px; padding: .75rem 1.5rem; font: 800 1rem system-ui, sans-serif; cursor: pointer; background: #ffcf4d; color: #251547; box-shadow: 0 4px 0 #bb7040; transition: transform .15s; }
    button:hover { transform: translateY(-2px); } button:active { transform: translateY(2px); box-shadow: 0 2px 0 #bb7040; }
    #start { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 1rem 2rem; font-size: 1.15rem; white-space: nowrap; box-shadow: 0 5px 0 #bb7040, 0 0 36px #ffcf4d88; }
    #start:hover { transform: translate(-50%, calc(-50% - 2px)); }
    #start:active { transform: translate(-50%, calc(-50% + 2px)); }
  </style>
</head>
<body>
  <main class="game">
    <h1>STAR SCOOP</h1>
    <p class="tagline">Catch the golden stars. Avoid the grumpy rocks!</p>
    <section class="hud"><span>⭐ <span id="score">0</span></span><span>Best: <span id="best">0</span></span></section>
    <div id="field" aria-label="Game field"><button id="start">▶ PLAY NOW</button><div id="ship">🛸</div></div>
    <p class="tip" id="tip">Move with ← →, A D, or drag your spaceship.</p>
  </main>
  <script>
    const field = document.querySelector('#field'), ship = document.querySelector('#ship');
    const scoreEl = document.querySelector('#score'), bestEl = document.querySelector('#best'), tip = document.querySelector('#tip'), start = document.querySelector('#start');
    let player = .5, targetPlayer = .5, score = 0, playing = false, lastSpawn = 0, lastTime = 0, items = [];
    let best = Number(localStorage.starScoopBest || 0); bestEl.textContent = best;
    for (let i = 0; i < 42; i++) { const s = document.createElement('i'); s.className = 'spark'; s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%'; s.style.opacity = .2 + Math.random()*.7; field.append(s); }
    function setPlayer(value) { targetPlayer = Math.max(.06, Math.min(.94, value)); }
    function spawn() { const good = Math.random() > .27; const el = document.createElement('div'); el.className = 'star'; el.textContent = good ? '⭐' : '☄️'; el.style.left = (8 + Math.random()*84)+'%'; el.style.top = '-35px'; field.append(el); items.push({el, x: parseFloat(el.style.left)/100, y: -35, good, speed: 125 + Math.min(score*4, 125) + Math.random()*70}); }
    function finish() { playing = false; start.textContent = '↻ PLAY AGAIN'; start.hidden = false; tip.textContent = `Ouch! A rock got you. You scooped ${score} star${score === 1 ? '' : 's'}!`; }
    function frame(time) {
      if (!playing) return;
      const dt = Math.min((time-lastTime)/1000, .05); lastTime = time;
      const movement = targetPlayer - player;
      player += movement * Math.min(1, 15 * dt);
      ship.style.left = player * 100 + '%';
      ship.style.transform = `translateX(-50%) rotate(${Math.max(-12, Math.min(12, movement * 130))}deg)`;
      if (time-lastSpawn > Math.max(350, 850-score*12)) { spawn(); lastSpawn = time; }
      const shipY = field.clientHeight - 64;
      for (let i = items.length-1; i >= 0; i--) {
        const item = items[i]; item.y += item.speed*dt; item.el.style.top = item.y+'px';
        if (item.y > shipY-28 && item.y < shipY+25 && Math.abs(item.x-player) < .105) {
          item.el.remove(); items.splice(i,1);
          if (!item.good) { finish(); break; }
          score++; scoreEl.textContent = score; if (score > best) { best = score; localStorage.starScoopBest = best; bestEl.textContent = best; }
        } else if (item.y > field.clientHeight+45) { item.el.remove(); items.splice(i,1); }
      }
      requestAnimationFrame(frame);
    }
    function begin() { items.forEach(x => x.el.remove()); items = []; score = 0; scoreEl.textContent = score; player = targetPlayer = .5; ship.style.left = '50%'; ship.style.transform = 'translateX(-50%)'; playing = true; start.hidden = true; tip.textContent = 'Golden stars are good. Rocks are very much not.'; lastTime = performance.now(); lastSpawn = lastTime-350; requestAnimationFrame(frame); }
    start.onclick = begin;
    addEventListener('keydown', e => { if (['ArrowLeft','a','A'].includes(e.key)) setPlayer(targetPlayer-.07); if (['ArrowRight','d','D'].includes(e.key)) setPlayer(targetPlayer+.07); if (e.key === ' ' && !playing) begin(); });
    field.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') { const r = field.getBoundingClientRect(); setPlayer((e.clientX-r.left)/r.width); } });
    field.addEventListener('pointerdown', e => { const r = field.getBoundingClientRect(); setPlayer((e.clientX-r.left)/r.width); });
  </script>
</body>
</html>
